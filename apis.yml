aid: bullish
name: Bullish
description: >-
  Bullish is an institutional digital-asset exchange and custodian operating a
  regulated spot, perpetual, dated-futures and options venue with an integrated
  automated market maker, deterministic central limit order book matching, and
  qualified custody. It publishes a genuinely machine-readable API estate: a
  79-operation OpenAPI 3.0.3 Trading API covering markets, orders, trades, AMM
  instructions, derivatives positions, portfolio-margin simulation, OTC and
  inter-dealer-broker booking, custody deposits and withdrawals, and history;
  six AsyncAPI 3.0.0 WebSocket documents for order book, trades, ticks, auction,
  index and private account data; and a FIX 4.2/5.0 order-entry and drop-copy
  surface. Authentication is JWT bearer minted from a client-signed ECDSA R1 or
  HMAC login rather than OAuth. Bullish is licensed or registered with the
  Gibraltar Financial Services Commission, BaFin (MiCA CASP and qualified crypto
  custodian), the Hong Kong SFC, FinCEN and NYDFS, and lists on the NYSE as BLSH.
