- aid: bullish:aggregator-api
  name: Bullish Aggregator API
  description: >-
    A small non-authenticated REST surface publishing aggregated public market data
    — tickers with 24-hour rolling statistics, order books, and the last 100 trades,
    each optionally filtered by market type. Intended for data aggregators and
    market-data consumers rather than for trading.
