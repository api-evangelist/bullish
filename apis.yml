- aid: bullish:deprecated-api
  name: Bullish Deprecated Features and APIs
  description: >-
    A separately published OpenAPI document carrying the 15 operations Bullish has
    deprecated or decommissioned — the v1 order create/cancel/get surface, v1 AMM
    instructions, v1 spot account reads and the v1 asset-transfer command — tagged
    "deprecated - q3 2024", "deprecated" and "decommissioned" so integrators can
    see exactly what is on the way out.
  humanURL: https://docs.exchange.bullish.com/rest/deprecated/bullish-deprecated-features-apis
