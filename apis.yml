  name: Bullish FIX API
  description: >-
    The Bullish FIX order-entry, drop-copy, reference-data and trading-status
    surface for institutional and high-frequency clients, with session management
    and component definitions documented. Rejections carry OrdRejReason (tag 103)
    and Text (tag 58) using the same numeric registry as REST.
