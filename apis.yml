- aid: bullish:bullish-otc-api
  name: Bullish Otc API
  description: >-
    The OTC Clearing Facility API (OTC API) is available to customers to book trades negotiated outside
    of the Bullish Exchange order book to Bullish's clearing and settlement platform. Customers may agree
    to an OTC transaction through bilateral negotiations or via a 3rd party RFQ platform. Once the two
    customers agree on the trade details, they can use the OTC API to book the trade to their Bullish
    account to benefit from Bullish's risk and collateral management system. For purposes of clarity,
    the OTC API is not for trading purposes.
  humanURL: https://docs.exchange.bullish.com/rest/introduction
  baseURL: https://api.exchange.bullish.com/trading-api
