apis:
- aid: bullish:trading-api
  name: Bullish Trading API
  description: >-
    The core Bullish REST API — 79 operations across markets, assets, index prices,
    option ladders and expiry prices, order creation and amendment, trades, AMM
    instructions, market-maker protection, derivatives positions, portfolio-margin
    simulation, OTC and inter-dealer-broker trade booking, custody deposit and
    withdrawal instructions, and account/trade/transfer history. Public market data
    is anonymous; everything else is JWT bearer.
  humanURL: https://docs.exchange.bullish.com/rest/introduction
  baseURL: https://api.exchange.bullish.com/trading-api
