notes: >-
  Bullish does not ship a full-surface REST client SDK in any language. What it
  publishes first-party are per-language SIGNER libraries — the hard part of the
  Bullish auth model is producing an ECDSA R1 (prime256v1) signature over the
  login/order payload, and Bullish open-sources that primitive for JavaScript,
  Python, Java and C++. Only the JavaScript signer is published to a package
  registry (npm `js-signer`); the rest are consumed from source on GitHub. A
  first-party Python REST client (`python-bullish-client`) and a first-party
  ccxt exchange module (`ccxt-bullish-python`) also exist on the org, but neither
  is published to PyPI — PyPI `bullish`, `bullish-api` and `bullish-sdk` all
  return 404.
