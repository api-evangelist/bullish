  /v2/mmp-configuration:
    post:
      x-position: 2
      tags:
        - market-maker-protection
      summary: Setup Market Maker Protection (MMP)
      description: |
        MMP configurations are setup per underlying asset symbol for a specific trading Account. While setting up MMP configurations you can specify `windowTimeInSeconds`, `frozenTimeInSeconds`, `quantityLimit` and `deltaLimit` and use it as best suited.
        Please reach out to your relationship manager to understand how to enable MMP for your trading accounts.

        - To get updates on the status of your set / reset MMP configs request for an underlying asset symbol over WS, please subscribe to `mmpRequest` TOPIC within the [Private Data WebSocket](/websocket/private/private-data).
        - To get updates about MMP triggered event over WS, please subscribe to the `mmpTriggered` TOPIC within the [Private Data WebSocket](/websocket/private/private-data).

        To update/amend your MMP configs, please use the ResetMMPCommandV1 to reset the MMP configurations, followed by setting up a new MMP config via setMMPCommandV1 per underlying asset symbol.

        Notes: 
        - MMP is only applicable for Options [Orders created](/rest/api/create-order-v-2) with the `isMMP` flag set to `true`.
        - ResetMMPCommandV1 will trigger only when there are no `isMMP=true` open orders on the account
      operationId: setMmpConfiguration
      parameters:
