        side:
          description: order side
          allOf:
            - $ref: "#/components/schemas/OrderSideAsString"
          example: "BUY"
        isTaker:
          description: denotes whether this is a taker's trade
          allOf:
            - $ref: "#/components/schemas/Boolean"
        tradeRebateAmount:
          description: amount of rebate that is credited to the user as part of the trade.
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        tradeRebateAssetSymbol:
          description: the symbol of the asset in which the rebate is paid
          allOf:
            - $ref: "#/components/schemas/QuoteAssetSymbol"
        otcMatchId:
          description: unique OTC match ID.
          allOf:
            - $ref: "#/components/schemas/OtcMatchId"
        otcTradeId:
          description: unique Bullish OTC trade ID
          allOf:
            - $ref: "#/components/schemas/OtcTradeId"
        clientOtcTradeId:
          description: unique Client OTC trade ID
          allOf:
            - $ref: "#/components/schemas/ClientOtcTradeId"
        createdAtDatetime:
          description: denotes the time the trade was executed by the exchange, ISO 8601 with millisecond as string
          allOf:
            - $ref: "#/components/schemas/DateTime"
        createdAtTimestamp:
          description: denotes the time the trade was executed by the exchange
          allOf:
            - $ref: "#/components/schemas/TimeStampAsString"
    OptionTrade:
      type: object
      required:
        - symbol
        - tradeId
        - price
        - quantity
        - side
        - isTaker
        - createdAtTimestamp
        - createdAtDatetime
        - optionType
        - otcTradeId
      properties:
        symbol:
          description: option market symbol
          allOf:
            - $ref: "#/components/schemas/OptionMarketSymbol"
        tradeId:
          description: unique trade ID
          allOf:
            - $ref: "#/components/schemas/TradeID"
        price:
          description: price
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        quantity:
          description: quantity
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        side:
          description: order side
          allOf:
            - $ref: "#/components/schemas/OrderSideAsString"
          example: "BUY"
        isTaker:
          description: denotes whether this is a taker's trade
          allOf:
            - $ref: "#/components/schemas/Boolean"
        createdAtDatetime:
          description: denotes the time the trade was executed by the exchange, ISO 8601 with millisecond as string
          allOf:
            - $ref: "#/components/schemas/DateTime"
        createdAtTimestamp:
          description: denotes the time the trade was executed by the exchange
          allOf:
            - $ref: "#/components/schemas/TimeStampAsString"
        optionType:
          description: Specifies if it's a call (right to buy) or a put (right to sell)
          allOf:
            - $ref: "#/components/schemas/OptionType"
        otcTradeId:
          description: unique Bullish OTC trade ID
          allOf:
            - $ref: "#/components/schemas/OtcTradeId"
    Tick:
      allOf:
        - type: object
          required:
            - createdAtDatetime
            - createdAtTimestamp
            - high
            - low
            - bestBid
            - bidVolume
            - bestAsk
            - askVolume
            - vwap
            - open
            - close
            - last
            - change
            - percentage
            - average
            - baseVolume
            - quoteVolume
            - bancorPrice
            - lastTradeDatetime
            - lastTradeTimestamp
            - lastTradeQuantity
            - ammData
          properties:
            createdAtDatetime:
              description: denotes the time of the current tick on the exchange, ISO 8601 with millisecond as string
              allOf:
                - $ref: "#/components/schemas/DateTime"
            createdAtTimestamp:
              description: denotes the time of the current tick on the exchange
              allOf:
                - $ref: "#/components/schemas/TimeStampAsString"
            high:
              description: highest price, see [asset value](/rest/general/price-quantity-precision) format
              allOf:
                - $ref: "#/components/schemas/AssetValue"
            low:
              description: lowest price, see [asset value](/rest/general/price-quantity-precision) format
              allOf:
                - $ref: "#/components/schemas/AssetValue"
            bestBid:
              description: current best bid (buy) price, see [asset value](/rest/general/price-quantity-precision) format
              allOf:
                - $ref: "#/components/schemas/AssetValue"
            bidIVPercentage:
              description: Implied volatility of the best bid price
              type: string
              example: "99.0"
            bidVolume:
              description: current best bid (buy) quantity (may be missing or undefined), see [asset value](/rest/general/price-quantity-precision) format
              allOf:
                - $ref: "#/components/schemas/AssetValue"
            bestAsk:
              description: current best ask (sell) price, see [asset value](/rest/general/price-quantity-precision) format
              allOf:
                - $ref: "#/components/schemas/AssetValue"
            askIVPercentage:
              description: Implied volatility of the best ask price
              type: string
              example: "99.0"
            askVolume:
              description: current best ask (sell) quantity (may be missing or undefined), see [asset value](/rest/general/price-quantity-precision) format
              allOf:
                - $ref: "#/components/schemas/AssetValue"
            vwap:
              description: volume weighed average price, see [asset value](/rest/general/price-quantity-precision) format
              allOf:
                - $ref: "#/components/schemas/AssetValue"
            open:
              description: opening price, see [asset value](/rest/general/price-quantity-precision) format
              allOf:
                - $ref: "#/components/schemas/AssetValue"
            close:
              description: price of last trade (closing price for current period), see [asset value](/rest/general/price-quantity-precision) format
              allOf:
                - $ref: "#/components/schemas/AssetValue"
            last:
              description: price of last trade (closing price for current period), see [asset value](/rest/general/price-quantity-precision) format
              allOf:
                - $ref: "#/components/schemas/AssetValue"
            change:
              description: absolute change, `last - open`, see [asset value](/rest/general/price-quantity-precision) format
              allOf:
                - $ref: "#/components/schemas/AssetValue"
            percentage:
              description: relative change, `(change/open) * 100`, see [asset value](/rest/general/price-quantity-precision) format
              allOf:
                - $ref: "#/components/schemas/AssetValue"
            average:
              description: average price, `(last + open) / 2`, see [asset value](/rest/general/price-quantity-precision) format
              allOf:
                - $ref: "#/components/schemas/AssetValue"
            baseVolume:
              description: volume of base asset traded for last 24 hours, see [asset value](/rest/general/price-quantity-precision) format
              allOf:
                - $ref: "#/components/schemas/AssetValue"
            quoteVolume:
              description: volume of quote asset traded for last 24 hours, see [asset value](/rest/general/price-quantity-precision) format
              allOf:
                - $ref: "#/components/schemas/AssetValue"
            bancorPrice:
              description: current price, see [asset value](/rest/general/price-quantity-precision) format
              allOf:
                - $ref: "#/components/schemas/AssetValue"
            markPrice:
              description: mark price represents the fair value of a contract at the current time.
              type: string
              example: "19999.00"
            fundingRate:
              description: funding rate is used to calculate funding, which measures the relative difference between the index price and mark price.
              type: string
              example: "0.01"
            openInterest:
              description: open interest is the total quantity of open long positions and short positions, see [asset value](/rest/general/price-quantity-precision) format (only applies to derivatives market)
              type: string
              example: "100000.32452"
            lastTradeDatetime:
              description: time of the last trade on this symbol, ISO 8601 with millisecond as string
              allOf:
                - $ref: "#/components/schemas/DateTime"
            lastTradeTimestamp:
              description: time of the last trade on this symbol
              allOf:
                - $ref: "#/components/schemas/TimeStampAsString"
            lastTradeQuantity:
              description: quantity of the last trade on this symbol, see [asset value](/rest/general/price-quantity-precision) format
              allOf:
                - $ref: "#/components/schemas/AssetValue"
            ammData:
              description: AMM data of all available fee tiers. Not applicable for `Option` markets
              type: array
              minItems: 0
              items:
                allOf:
                  - $ref: "#/components/schemas/AmmData"
        - $ref: "#/components/schemas/OptionGreeks"
    AmmData:
      type: object
      description: AMM data
      required:
        - feeTierId
        - bidSpreadFee
        - askSpreadFee
        - currentPrice
      properties:
        feeTierId:
          allOf:
            - $ref: "#/components/schemas/FeeTierId"
        bidSpreadFee:
          description: bid spread fee
          type: string
          example: "0.00040000"
        askSpreadFee:
          description: ask spread fee
          type: string
          example: "0.00040000"
        currentPrice:
          description: current AMM price
          type: string
          example: "16856.0000"
    MarketSymbol:
      type: string
      description: market symbol. E.g. `BTCUSDC`
      example: "BTCUSDC"
    DerivativeMarketSymbol:
      type: string
      description: market symbol. E.g. `BTC-USDC-20250919-90000-C` for OPTION markets and `BTC-USDC-20250919` for DATED FUTURE markets.
      example: "BTC-USDC-20250919-90000-C"
    DatedFutureMarketSymbol:
      type: string
      description: market symbol. E.g. `BTC-USDC-PERP` for PERPETUAL and `BTC-USDC-20241201` for DATED FUTURE markets.
      example: "BTC-USDC-20241201"
    OptionMarketSymbol:
      type: string
      description: market symbol. E.g. `BTC-USDC-20241004-70000-C` for OPTION markets.
      example: "BTC-USDC-20241004-70000-C"
    OptionAndDatedFuturesMarketSymbol:
      type: string
      description: market symbol. E.g. `BTC-USDC-20241004-70000-C` for OPTION markets and `BTC-USDC-20241201` for DATED FUTURE markets.
      example: "BTC-USDC-20241004-70000-C"
    PerpMarketSymbol:
      type: string
      description: market symbol. E.g. `BTC-USDC-PERP` for PERPETUAL market
      example: "BTC-USDC-PERP"
    FeeTier:
      type: object
      description: unique fee tier
      required:
        - feeTierId
        - staticSpreadFee
        - isDislocationEnabled
      properties:
        feeTierId:
          allOf:
            - $ref: "#/components/schemas/FeeTierId"
        staticSpreadFee:
          description: static spread fee
          type: string
          example: "0.00040000"
        isDislocationEnabled:
          description: dislocation enabled/disabled
          type: boolean
          example: true
    FeeTierId:
      type: string
      description: unique fee tier ID, see [Get Market By Symbol](/rest/api/get-market-by-symbol)
      example: "1"
    InstrumentId:
      type: string
      description: custody identifier for instrument
      example: "BTC"
    AssetSymbol:
      type: string
      description: asset symbol as denoted in the world
      example: "BTC"
    UnderlyingAssetSymbol:
      type: string
      description: the underlying asset symbol that is configured for MMP checks
      example: "BTC"
    QuoteAssetSymbol:
      type: string
      description: asset symbol as denoted in the world
      example: "USDC"
    AssetName:
      type: string
      description: asset name
      example: "Bitcoin"
    AssetID:
      type: string
      description: unique asset ID
      example: "1"
    CollateralBand:
      type: object
      properties:
        collateralPercentage:
          description: collateral percentage applied to the asset for this band - a value of 90.00 indicates 90% of the asset is eligible to be used as collateral
          type: string
          example: "95.00"
        bandLimitUSD:
          description: upper limit in USD for this band
          type: string
          example: "1000000.0000"
    UnderlyingAsset:
      type: object
      properties:
        symbol:
          description: underlying asset symbol
          type: string
          example: "BTC"
        assetId:
          description: underlying asset ID
          type: string
          example: "1"
        bpmMinReturnStart:
          description: start of the 1/1000 biggest downward price movement of an underlying asset over 6 hours
          type: string
          example: "40.0000"
        bpmMinReturnEnd:
          description: end of the 1/1000 biggest downward price movement of an underlying asset over 6 hours
          type: string
          example: "20.0000"
        bpmMaxReturnStart:
          description: start of the 1/1000 biggest upward price movement of an underlying asset over 6 hours
          type: string
          example: "30.0000"
        bpmMaxReturnEnd:
          description: end of the 1/1000 biggest upward price movement of an underlying asset over 6 hours
          type: string
          example: "50.0000"
        marketRiskFloorPctStart:
          description: the percentage range of risk reduction allowed for a portfolio
          type: string
          example: "1.00"
        marketRiskFloorPctEnd:
          description: the percentage range of risk reduction allowed for a portfolio
          type: string
          example: "5.00"
        bpmTransitionDateTimeStart:
          description: the start datetime which the values linearly transition from `bpmMinReturnStart` to `bpmMinReturnEnd` for an underlying asset
          type: string
          example: "2024-08-02T12:00:00.000Z"
        bpmTransitionDateTimeEnd:
          description: the end datetime which the values linearly transition from `bpmMinReturnStart` to `bpmMinReturnEnd` for an underlying asset
          type: string
          example: "2024-08-02T18:00:00.000Z"

    VolGridConfiguration:
      type: object
      properties:
        assetId:
          description: underlying asset ID
          type: string
          example: "1"
        assetSymbol:
          description: underlying asset symbol
          type: string
          example: "BTC"
        effectiveFromDatetime:
          description: ISO 8601 datetime of when this vol grid configuration became effective
          type: string
          format: date-time
          example: "2026-05-29T08:00:00.000Z"
        volGrid:
          description: list of vol grid rows, one per days-to-expiry bucket
          type: array
          items:
            $ref: "#/components/schemas/VolGridData"
          example:
            - timeToExpiryDays: 0
              atmMax: "0.100754"
              atmMin: "-0.078081"
              skewMax: "0.083929"
              skewMin: "-0.103593"
            - timeToExpiryDays: 1
              atmMax: "0.100754"
              atmMin: "-0.078081"
              skewMax: "0.083929"
              skewMin: "-0.103593"
            - timeToExpiryDays: 7
              atmMax: "0.100754"
              atmMin: "-0.078081"
              skewMax: "0.063888"
              skewMin: "-0.073318"
            - timeToExpiryDays: 14
              atmMax: "0.100754"
              atmMin: "-0.078081"
              skewMax: "0.043847"
              skewMin: "-0.043043"
            - timeToExpiryDays: 30
              atmMax: "0.100754"
              atmMin: "-0.078081"
              skewMax: "0.034441"
              skewMin: "-0.034124"
            - timeToExpiryDays: 60
              atmMax: "0.100754"
              atmMin: "-0.078081"
              skewMax: "0.024271"
              skewMin: "-0.02397"
            - timeToExpiryDays: 90
              atmMax: "0.100754"
              atmMin: "-0.078081"
              skewMax: "0.024142"
              skewMin: "-0.024381"
            - timeToExpiryDays: 180
              atmMax: "0.100754"
              atmMin: "-0.078081"
              skewMax: "0.017566"
              skewMin: "-0.017433"
    VolGridData:
      type: object
      properties:
        timeToExpiryDays:
          description: days-to-expiry bucket this row applies to. supported buckets — [0, 1, 7, 14, 30, 60, 90, 180]
          type: integer
          example: 0
        atmMax:
          description: max upward ATM IV shift applied in BPM stress. supported range — [0, 1]
          type: string
          example: "0.100754"
        atmMin:
          description: max downward ATM IV shift. supported range — [-1, 0]
          type: string
          example: "-0.078081"
        skewMax:
          description: max upward skew shift. supported range — [0, 1]
          type: string
          example: "0.083929"
        skewMin:
          description: max downward skew shift. supported range [-1, 0]
          type: string
          example: "-0.103593"
    PriceQuantityTuple:
      type: object
      properties:
        price:
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        priceLevelQuantity:
          allOf:
            - $ref: "#/components/schemas/AssetValue"
    OrderBook:
      type: object
      required:
        - bids
        - asks
        - datetime
        - timestamp
        - sequenceNumber
      properties:
        bids:
          description: bids
          type: array
          minItems: 0
          maxItems: 10
          items:
            allOf:
              - $ref: "#/components/schemas/PriceQuantityTuple"
        asks:
          description: asks
          type: array
          minItems: 0
          maxItems: 10
          items:
            allOf:
              - $ref: "#/components/schemas/PriceQuantityTuple"
        datetime:
          description: date and time of order book snapshot, ISO 8601 with millisecond as string
          allOf:
            - $ref: "#/components/schemas/DateTime"
        timestamp:
          description: timestamp of order book snapshot
          allOf:
            - $ref: "#/components/schemas/TimeStampAsString"
        sequenceNumber:
          description: an incremented unique identifier of the order book snapshot
          type: integer
          example: 999
    IndexPrice:
      type: object
      required:
        - assetSymbol
        - price
        - updatedAtDatetime
        - updatedAtTimestamp
      properties:
        assetSymbol:
          description: Asset symbol
          allOf:
            - $ref: "#/components/schemas/AssetSymbol"
        price:
          description: Asset price in USD
          example: "66100.0000"
          type: string
        updatedAtDatetime:
          description: Date and time when the index price is updated
          allOf:
            - $ref: "#/components/schemas/DateTime"
        updatedAtTimestamp:
          description: Timestamp when the index price is updated
          allOf:
            - $ref: "#/components/schemas/TimeStamp"
    Market:
      type: object
      required:
        - marketId
        - symbol
        - quoteAssetId
        - baseAssetId
        - quoteSymbol
        - baseSymbol
        - quotePrecision
        - basePrecision
        - pricePrecision
        - quantityPrecision
        - costPrecision
        - priceBuffer
        - minQuantityLimit
        - maxQuantityLimit
        - timeZone
        - tickSize
        - liquidityTickSize
        - liquidityPrecision
        - feeGroupId
        - roundingCorrectionFactor
        - makerMinLiquidityAddition
        - spotTradingEnabled
        - marginTradingEnabled
        - marketEnabled
        - createOrderEnabled
        - cancelOrderEnabled
        - liquidityInvestEnabled
        - liquidityWithdrawEnabled
        - feeTiers
        - marketType
        - openInterestUSD
        - concentrationRiskThresholdUSD
        - concentrationRiskPercentage
        - expiryDatetime
      properties:
        marketId:
          description: unique market ID
          allOf:
            - $ref: "#/components/schemas/MarketID"
        symbol:
          description: market symbol
          allOf:
            - $ref: "#/components/schemas/OptionMarketSymbol"
        baseSymbol:
          description: base asset symbol (only applies to spot market)
          allOf:
            - $ref: "#/components/schemas/AssetSymbol"
        underlyingBaseSymbol:
          description: underlying base asset symbol (only applies to derivative market)
          example:
          allOf:
            - $ref: "#/components/schemas/AssetSymbol"
        quoteSymbol:
          description: quote asset symbol (only applies to spot market)
          allOf:
            - $ref: "#/components/schemas/AssetSymbol"
        underlyingQuoteSymbol:
          description: underlying quote asset symbol (only applies to derivative market)
          example:
          allOf:
            - $ref: "#/components/schemas/AssetSymbol"
        quoteAssetId:
          description: quote asset id
          allOf:
            - $ref: "#/components/schemas/AssetID"
        baseAssetId:
          description: base asset id
          allOf:
            - $ref: "#/components/schemas/AssetID"
        quotePrecision:
          description: quote precision
          type: integer
          example: 4
        basePrecision:
          description: base precision
          type: integer
          example: 8
        pricePrecision:
          description: number of decimal digits 'after the dot' for price
          type: integer
          example: 8
        quantityPrecision:
          description: number of decimal digits 'after the dot' for quantity
          type: integer
          example: 8
        costPrecision:
          description: number of decimal digits 'after the dot' for cost, `price * quantity`
          type: integer
          example: 8
        priceBuffer:
          description: buffer range of limit price from the last traded price. Not applicable for `Option` markets
          type: string
          example: "0.3"
        minQuantityLimit:
          description: order quantity should be > min, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        maxQuantityLimit:
          description: order quantity should be < max, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        timeZone:
          description: time zone
          type: string
          example: Etc/UTC
        tickSize:
          description: tick size, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        liquidityTickSize:
          description: liquidity tick size. Not applicable for `Option` markets
          type: string
          example: "100.0000"
        liquidityPrecision:
          description: liquidity precision. Not applicable for `Option` markets
          type: integer
          example: 4
        roundingCorrectionFactor:
          description: rounding correction factor for market
          type: string
          example: "0.00000001"
        makerMinLiquidityAddition:
          description: minimum amount required to invest liquidity to market. Not applicable for `Option` markets
          type: string
          example: "5000"
        orderTypes:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/OrderTypeAsString"
        spotTradingEnabled:
          description: spot trading enabled (only applies for Spot markets)
          type: boolean
          example: true
        marginTradingEnabled:
          description: margin trading enabled (only applies for Spot markets)
          type: boolean
          example: true
        marketEnabled:
          description: market enabled
          type: boolean
          example: true
        createOrderEnabled:
          description: able to create order
          type: boolean
          example: true
        amendOrderEnabled:
          description: able to amend order
          type: boolean
          example: true
          deprecated: true
        cancelOrderEnabled:
          description: able to cancel order
          type: boolean
          example: true
        liquidityInvestEnabled:
          description: able to invest liquidity to market. Not applicable for `Option` markets
          type: boolean
          example: true
        liquidityWithdrawEnabled:
          description: able to withdraw liquidity from market. Not applicable for `Option` markets
          type: boolean
          example: true
        feeGroupId:
          description: Identifier to the trade fee assigned to this market. Used with `tradeFeeRate` at [Get Trading Account](/rest/api/get-trading-account-by-id)
          type: integer
          example: 1
        feeTiers:
          description: all available fee tiers. Not applicable for `Option` markets
          type: array
          minItems: 0
          items:
            allOf:
              - $ref: "#/components/schemas/FeeTier"
        marketType:
          description: market type, e.g. "SPOT" for market like "BTCUSD", "PERPETUAL" for market like "BTC-USDC-PERP", "DATED_FUTURE" for market like "BTC-USDC-20250901", "OPTION" for market like "BTC-USDC-20250901-90000-C"
          allOf:
            - $ref: "#/components/schemas/MarketTypeAsString"
        contractMultiplier:
          description: contract multiplier. (only applies to perpetual market)
          type: integer
          example: null
        settlementAssetSymbol:
          description: settlement asset symbol. (only applies to perpetual market)
          type: string
          example: null
        openInterestUSD:
          description: cumulative notional value of all open interest for a specific derivative contract on the exchange.
          type: string
          example: null
        concentrationRiskThresholdUSD:
          description: open interest notional of an account for a specific derivative contract.
          type: string
          example: null
        concentrationRiskPercentage:
          description: percentage of the total open interest for a specific derivative contract.
          type: string
          example: null
        expiryDatetime:
          description: denotes the time when the market expires in ISO 8601 with millisecond format as string
          type: string
          example: 2024-10-04T08:00:00.000Z
        optionStrikePrice:
          description: The price at which the option can be exercised upon expiry.
          type: string
          example: "70000.0000"
        optionType:
          description: Specifies if it's a call (right to buy) or a put (right to sell)
          allOf:
            - $ref: "#/components/schemas/OptionType"
        premiumCapRatio:
          description: A cap that is set on the underlying asset's movement as part of the premium that limits the option buyer's profit.
          type: string
          example: "0.10"
        auctionEnabled:
          description: whether auction is enabled for this market
          type: boolean
          example: true
        auctionPriceCollar:
          description: auction clearing price range from Index Price, expressed as a decimal ratio
          type: string
          example: "0.05"
    Auction:
      type: object
      properties:
        auctionId:
          description: unique auction identifier
          type: string
          example: "397735387747975680"
        symbol:
          description: market symbol
          allOf:
            - $ref: "#/components/schemas/MarketSymbol"
        phase:
          description: "current auction phase: COOLING, ACCUMULATION, LOCKDOWN, CROSS"
          type: string
          enum:
            - COOLING
            - ACCUMULATION
            - LOCKDOWN
            - CROSS
          example: ACCUMULATION
        startTime:
          description: accumulation start time, ISO 8601 with millisecond as string
          allOf:
            - $ref: "#/components/schemas/DateTime"
        lockdownTime:
          description: lockdown start time, ISO 8601 with millisecond as string
          allOf:
            - $ref: "#/components/schemas/DateTime"
        scheduledCrossTime:
          description: scheduled cross time, ISO 8601 with millisecond as string
          allOf:
            - $ref: "#/components/schemas/DateTime"
        createAuctionOrderEnabled:
          description: whether new auction orders can be created. Defaults true after auction starts (post-cooling)
          type: boolean
          example: true
        amendAuctionOrderEnabled:
          description: whether auction orders can be amended. Defaults true after auction starts; auto-switches to false during lockdown
          type: boolean
          example: true
        cancelAuctionOrderEnabled:
          description: whether auction orders can be cancelled. Defaults true after auction starts; auto-switches to false during lockdown
          type: boolean
          example: true
        createdAt:
          description: auction creation time, ISO 8601 with millisecond as string
          allOf:
            - $ref: "#/components/schemas/DateTime"
        updatedAt:
          description: auction last update time, ISO 8601 with millisecond as string
          allOf:
            - $ref: "#/components/schemas/DateTime"
    AuctionNoii:
      type: object
      properties:
        auctionId:
          description: auction identifier
          type: string
          example: "397735387747975680"
        symbol:
          description: market symbol
          allOf:
            - $ref: "#/components/schemas/MarketSymbol"
        timestamp:
          description: data timestamp, ISO 8601 with millisecond as string
          allOf:
            - $ref: "#/components/schemas/DateTime"
        farPrice:
          description: indicative clearing price (auction orders only)
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        referencePrice:
          description: "Last Trade Price on Regular Continuous Orderbook; if Last Trade Price is not available, then Index Price"
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        imbalanceDirection:
          description: "imbalance direction: BUY, SELL, or NONE"
          type: string
          enum:
            - BUY
            - SELL
            - NONE
          example: BUY
        imbalanceQuantity:
          description: unmatched quantity at farPrice
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        pairedQuantity:
          description: predicted matched volume
          allOf:
            - $ref: "#/components/schemas/AssetValue"
    AuctionResult:
      type: object
      properties:
        auctionId:
          description: auction identifier
          type: string
          example: "397735387747975680"
        symbol:
          description: market symbol
          allOf:
            - $ref: "#/components/schemas/MarketSymbol"
        crossTime:
          description: actual cross time, ISO 8601 with millisecond as string
          allOf:
            - $ref: "#/components/schemas/DateTime"
        clearingPrice:
          description: final clearing price
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        referencePrice:
          description: "Last Trade Price on Regular Continuous Orderbook; if Last Trade Price is not available, then Index Price"
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        pairedQuantity:
          description: total matched volume
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        imbalanceDirection:
          description: "final imbalance direction: BUY, SELL, or NONE"
          type: string
          enum:
            - BUY
            - SELL
            - NONE
          example: NONE
        imbalanceQuantity:
          description: final imbalance quantity
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        createdAtDatetime:
          description: denotes the time the auction cross was executed, ISO 8601 with millisecond as string
          allOf:
            - $ref: "#/components/schemas/DateTime"
    Asset:
      type: object
      required:
        - assetId
        - symbol
        - name
        - precision
        - minBalanceInterest
        - minFee
        - apr
        - collateralRating
        - maxBorrow
        - totalOfferedLoanQuantity
        - loanBorrowedQuantity
        - collateralBands
        - underlyingAsset
      properties:
        assetId:
          description: unique asset ID
          allOf:
            - $ref: "#/components/schemas/AssetID"
        symbol:
          description: asset symbol
          allOf:
            - $ref: "#/components/schemas/AssetSymbol"
        name:
          description: asset name
          allOf:
            - $ref: "#/components/schemas/AssetName"
        precision:
          description: number of decimal digits 'after the dot' for asset amount
          type: string
          example: "8"
        minBalanceInterest:
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        minFee:
          description: minimum fee
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        apr:
          description: annualized percentage rate
          type: string
          example: "12.50"
        collateralRating:
          deprecated: true
          description: collateral rating applied to this asset, a value of 100.00 indicates 100%. `Deprecated in favour of collateral bands`
          type: string
          example: "95.00"
        maxBorrow:
          description: maximum quantity that can be borrowed for this asset
          type: string
          example: "10.00000000"
        totalOfferedLoanQuantity:
          description: quantity of an asset that is across all loan offers on the exchange
          type: string
          example: "5.00000000"
        loanBorrowedQuantity:
          description: amount of loans that is currently being borrowed for the asset
          type: string
          example: "3.00000000"
        collateralBands:
          description: list of collateral bands for the asset. A collateral band holds the upper limit of the USD notional and the corresponding collateral percentage which applies to it. An asset's collateral value will be capped by the highest limit of the collateral bands, any remaining amount greater than this limit will have a collateral percentage of 0. If an asset has an empty list of CollateralBands, this signifies that the asset has a collateralValue of 0.
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/CollateralBand"
        underlyingAsset:
          description: underlying asset for the asset.
          allOf:
            - $ref: "#/components/schemas/UnderlyingAsset"
    OHLCVCandle:
      type: object
      properties:
        open:
          description: see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        high:
          description: see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        low:
          description: see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        close:
          description: see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        volume:
          description: see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        createdAtTimestamp:
          allOf:
            - $ref: "#/components/schemas/TimeStampAsString"
        createdAtDatetime:
          description: date and time of the candle, ISO 8601 with millisecond as string
          allOf:
            - $ref: "#/components/schemas/DateTime"
        publishedAtTimestamp:
          description: date and time of the candle getting published, ISO 8601 with millisecond as string
          allOf:
            - $ref: "#/components/schemas/TimeStampAsString"
    BorrowInterest:
      type: object
      required:
        - assetId
        - assetSymbol
        - borrowedQuantity
        - totalBorrowedQuantity
        - createdAtDatetime
        - createdAtTimestamp
      properties:
        assetId:
          description: unique asset ID
          allOf:
            - $ref: "#/components/schemas/AssetID"
        assetSymbol:
          description: asset symbol
          allOf:
            - $ref: "#/components/schemas/AssetSymbol"
        borrowedQuantity:
          description: the principal borrowed quantity
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        totalBorrowedQuantity:
          description: the sum of the principal borrowed quantity and the interest charged
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        createdAtDatetime:
          description: denotes the hour in which the principal quantity was borrowed or when the interest was charged, ISO 8601 with millisecond as string
          type: string
          format: date-time
          example: "2020-08-21T08:00:00.000Z"
        createdAtTimestamp:
          description: denotes the hour in which the principal quantity was borrowed or when the interest was charged
          type: string
          format: string
          example: "1621490985000"
    CurrentExchangeTimeResponse:
      type: object
      required:
        - timestamp
        - datetime
      properties:
        timestamp:
          allOf:
            - $ref: "#/components/schemas/TimeStampAsString"
        datetime:
          description: ISO 8601 with millisecond as string
          allOf:
            - $ref: "#/components/schemas/DateTime"
    Nonce:
      type: object
      required:
        - upperBound
        - lowerBound
      properties:
        lowerBound:
          description: lower bound of nonce range
          type: integer
          example: 8455
        upperBound:
          description: upper bound of nonce range
          type: integer
          example: 9455
    OptionType:
      description: Type of Option market
      example: CALL
      type: string
      enum:
        - CALL
        - PUT
    OrderSide:
      type: string
      example: BUY
      enum:
        - BUY
        - SELL
    TimeBucket:
      type: string
      example: 1m
      enum:
        - 1m
        - 5m
        - 30m
        - 1h
        - 6h
        - 12h
        - 1d
    OrderStatus:
      type: string
      example: OPEN
      enum:
        - OPEN
        - CLOSED
        - CANCELLED
        - REJECTED
    AMMInstructionStatus:
      type: string
      example: OPEN
      enum:
        - OPEN
        - CLOSED
    DelayBySeconds:
      description: Delay the cancel-all-orders request by (seconds) as a timeout mechanism
      type: string
      enum:
        - "5"
        - "10"
        - "15"
        - "20"
        - "25"
        - "30"
        - "40"
        - "50"
        - "60"
      example: "5"
    CancelId:
      description: Unique id for this cancel request which is an unsigned 64 bit integer expressed as string
      type: string
      example: "123456789"
    DerivativesPositionResponse:
      description: Derivatives Position of one market for the trading account
      type: object
      properties:
        tradingAccountId:
          allOf:
            - $ref: "#/components/schemas/TradingAccountId"
        symbol:
          example: "BTC-USDC-PERP"
          allOf:
            - $ref: "#/components/schemas/MarketSymbol"
        side:
          allOf:
            - $ref: "#/components/schemas/OrderSide"
        quantity:
          description: Current size of the  position [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        notional:
          description: Notional value of the current position, calculated using the mark price
          allOf:
            - $ref: "#/components/schemas/UsdcValue"
        entryNotional:
          description: Notional value of the position, using the average entry price
          allOf:
            - $ref: "#/components/schemas/UsdcValue"
        mtmPnl:
          description: Sum of all mark-to-market profits and losses plus profits and losses realised from trading, accumulated since the last settlement
          allOf:
            - $ref: "#/components/schemas/UsdcValue"
        reportedMtmPnl:
          description: The profit/losses from the net price change since the last time the absolute quantity decreased. It is updated with every mark to market and is not updated during settlement or a position size increase
          allOf:
            - $ref: "#/components/schemas/UsdcValue"
        reportedFundingPnl:
          description: Sum of all funding payments received  since the position was opened. This is updated every time funding is paid.
          allOf:
            - $ref: "#/components/schemas/UsdcValue"
        realizedPnl:
          description: Total profits realized since the trading account first opened this position. This is only updated every time a position's absolute quantity (aka size) is reduced.
          allOf:
            - $ref: "#/components/schemas/UsdcValue"
        settlementAssetSymbol:
          description: Settlement Asset Symbol
          type: string
          example: "USDC"
        createdAtDatetime:
          description: Denotes the time the position was created by the exchange, ISO 8601 with millisecond as string
          allOf:
            - $ref: "#/components/schemas/DateTime"
        createdAtTimestamp:
          description: Denotes the time the position was created by the exchange, number of milliseconds since EPOCH
          allOf:
            - $ref: "#/components/schemas/TimeStampAsString"
        updatedAtDatetime:
          description: Denotes the time the position was updated by the exchange, ISO 8601 with millisecond as string
          allOf:
            - $ref: "#/components/schemas/DateTime"
        updatedAtTimestamp:
          description: Denotes the time the position was updated by the exchange, number of milliseconds since EPOCH
          allOf:
            - $ref: "#/components/schemas/TimeStampAsString"
        greeks:
          description: Position greeks
          allOf:
            - $ref: "#/components/schemas/PositionGreeks"
    DerivativesSettlementResponse:
      description: Derivatives Settlement of one market for the trading account
      type: object
      properties:
        tradingAccountId:
          allOf:
            - $ref: "#/components/schemas/TradingAccountId"
        symbol:
          example: "BTC-USDC-PERP"
          allOf:
            - $ref: "#/components/schemas/DatedFutureMarketSymbol"
        side:
          allOf:
            - $ref: "#/components/schemas/OrderSide"
        settlementQuantity:
          description: position size at the time of the settlement
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        deltaTradingQuantity:
          description: the change in the position size from the account's trading activities
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        mtmPnl:
          description: mark to market profit (losses) accumulated since the last settlement
          allOf:
            - $ref: "#/components/schemas/UsdcValue"
        fundingPnl:
          description: funding profits (losses) accumulated since the last settlement. Applicable for perpetuals only.
          allOf:
            - $ref: "#/components/schemas/UsdcValue"
        eventType:
          description: derivatives position update event types
          type: string
          example: "settlementUpdate"
        settlementMarkPrice:
          description: market price at which the position was settled for this past cycle
          allOf:
            - $ref: "#/components/schemas/UsdcValue"
        settlementIndexPrice:
          description: index price at which the position was settled for this past cycle
          allOf:
            - $ref: "#/components/schemas/UsdcValue"
        settlementFundingRate:
          description: funding rate at which the position was settled for this past cycle. Applicable for perpetuals only.
          type: string
          example: "10.0"
        settlementDatetime:
          description: Denotes the time the position was settled by the exchange, ISO 8601 with millisecond as string
          allOf:
            - $ref: "#/components/schemas/DateTime"
        settlementTimestamp:
          description: Denotes the time the position was settled by the exchange, number of milliseconds since EPOCH
          allOf:
            - $ref: "#/components/schemas/TimeStampAsString"
    SubAccountTransferResponse:
      description: Get account transfer history
      type: object
      properties:
        requestId:
          description: unique identifier of the transfer request
          type: string
          example: "1"
        toTradingAccountId:
          description: recipient's trading account
          allOf:
            - $ref: "#/components/schemas/TradingAccountId"
        fromTradingAccountId:
          description: sender's trading account
          type: string
          example: "121000000000001"
        assetSymbol:
          description: asset currency of the transfer
          allOf:
            - $ref: "#/components/schemas/AssetSymbol"
        quantity:
          description: transfer quantity
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        status:
          description: transfer status [CLOSED/OPEN/REJECTED]
          type: string
          example: "CLOSED"
        statusReasonCode:
          description: status reason code
          type: string
          example: "6002"
        statusReason:
          description: readable status reason
          type: string
          example: "Executed"
        createdAtTimestamp:
          allOf:
            - $ref: "#/components/schemas/TimeStampAsString"
        createdAtDatetime:
          allOf:
            - $ref: "#/components/schemas/DateTime"
    SimulationPosition:
      type: object
      required:
        - symbol
        - quantity
      properties:
        symbol:
          description: asset or market symbol. E.g. `USDC` for asset and `BTCUSDC` for market
          type: string
          example: "BTC-USDC-PERP"
        quantity:
          description: size of the position
          type: string
          example: "1.0"

    SimulationOrder:
      type: object
      required:
        - symbol
        - quantity
      properties:
        symbol:
          allOf:
            - $ref: "#/components/schemas/MarketSymbol"
        quantity:
          description: quantity placed for order
          type: string
          example: "1.0"
        limitPrice:
          description: limit price for order
          type: string
          example: "10000.0"
        timeInForce:
          allOf:
            - $ref: "#/components/schemas/OrderTimeInForceAsString"
    ReferencePrice:
      type: object
      properties:
        symbol:
          description: asset or market symbol. E.g. `USDC` for asset and `BTCUSDC` for market
          type: string
          example: "BTC"
        price:
          description: reference price for asset or market
          type: string
          example: "12000.0"
    TradeFeeRate:
      type: object
      required:
        - feeGroupId
        - makerFee
        - takerFee
        - makerOtcFee
        - takerOtcFee
        - brokerFee
      properties:
        feeGroupId:
          type: integer
          description: Identifier for this particular fee tier
          example: 1
        makerFee:
          type: string
          description: Maker Fee in decimal value
          example: "0.00005000"
        takerFee:
          type: string
          description: Taker Fee in decimal value
          example: "0.00005000"
        makerOtcFee:
          type: string
          description: OTC Maker Fee in decimal value
          example: "0.00005000"
        takerOtcFee:
          type: string
          description: OTC Taker Fee in decimal value
          example: "0.00005000"
        brokerFee:
          type: string
          description: Fee charged for brokered OTC trade in decimal value
          example: "0.00005000"
        auctionFee:
          type: string
          description: Fee charged for auction trade in decimal value
          example: "0.00005000"
    PriceVolOffsetParams:
      type: object
      description: Parameters for adjusting prices and volatility in portfolio simulation
      properties:
        cryptoPriceMultipliers:
          type: object
          description: Symbol-specific price multipliers. When specified for a symbol, overrides the global multiplier
          additionalProperties:
            type: number
            format: double
          example:
            BTC: 1.2
            ETH: 0.9
        globalCryptoPriceMultiplier:
          type: number
          format: double
          description: Global price multiplier applied to all crypto assets (except stablecoins and symbols with explicit multipliers)
          default: 1.0
          example: 1.1
        volOffset:
          type: number
          format: double
          description: Offset to add to implied volatility for options pricing. Can be positive or negative
          default: 0.0
          example: 0.05
    PortfolioSimulationRequest:
      type: object
      required:
        - tradingAccountId
      properties:
        tradingAccountId:
          allOf:
            - $ref: "#/components/schemas/TradingAccountId"
        positions:
          type: array
          description: portfolio position to be used in simulation
          items:
            allOf:
              - $ref: "#/components/schemas/SimulationPosition"
        orders:
          type: array
          description: pending orders to be used in simulation
          items:
            allOf:
              - $ref: "#/components/schemas/SimulationOrder"
        referencePrices:
          type: array
          description: reference price to be used in simulation
          items:
            allOf:
              - $ref: "#/components/schemas/ReferencePrice"
        priceVolOffsetParams:
          description: optional parameters for price and volatility adjustments in simulation
          allOf:
            - $ref: "#/components/schemas/PriceVolOffsetParams"
    OptionLadderResponse:
      description: Option Ladder Response
      type: object
      properties:
        symbol:
          description: Symbol of the option market. For example `BTC-USDC-20241004-70000-C`
          allOf:
            - $ref: "#/components/schemas/OptionMarketSymbol"
        baseSymbol:
          description: Base symbol of the option market. For `BTC-USDC-20241004-70000-C`, it will be `BTC`
          allOf:
            - $ref: "#/components/schemas/AssetSymbol"
        settlementAssetSymbol:
          description: Asset used for Mark To Market settlement
          allOf:
            - $ref: "#/components/schemas/QuoteAssetSymbol"
        bidQuantity:
          description: Quantity of `bid`
          type: string
          example: "0.0"
        askQuantity:
          description: Quantity of `ask`
          type: string
          example: "0.0"
        bidIVPercentage:
          description: Implied volatility of the best bid price
          type: string
          example: "99.0"
        askIVPercentage:
          description: Implied volatility of the best ask price
          type: string
          example: "99.0"
        bid:
          description: Bid price in the order book
          type: string
          example: "90000.0000"
        ask:
          description: Ask price in the order book
          type: string
          example: "90000.0000"
        underlyingPrice:
          description: Index price of the base asset
          type: string
          example: "100000.0000"
        optionStrikePrice:
          description: Strike price of the option market
          type: string
          example: "90000"
        markPrice:
          description: Mark Price of the option market
          type: string
          example: "100.0000"
        quantity:
          description: Number of contracts outstanding
          type: string
          example: "1000"
        openInterest:
          description: Amount of outstanding contracts in the exchange
          type: string
          example: "0.11442400"
        openInterestUSD:
          description: USD value of outstanding contracts in the exchange
          type: string
          example: "1144240.0000"
        optionType:
          description: Specifies if it's a call (right to buy) or a put (right to sell)
          allOf:
            - $ref: "#/components/schemas/OptionType"
        expiryDatetime:
          allOf:
            - $ref: "#/components/schemas/DateTime"
        greeks:
          description: Option greeks
          allOf:
            - $ref: "#/components/schemas/OptionGreeks"

    OptionGreeks:
      description: Pricing parameters for option instruments. Only returned for option markets and omitted for spot and perpetual markets.
      type: object
      properties:
        delta:
          description: Sensitivity of an option's price to a $1 change in the price of the underlying asset. Only present for option markets.
          type: string
          example: "0.98"
        gamma:
          description: Rate of change of Delta with respect to a $1 change in the underlying asset's price. Only present for option markets.
          type: string
          example: "0.98"
        theta:
          description: The rate at which an option's price decreases as it approaches its expiration date. Only present for option markets.
          type: string
          example: "-0.17"
        vega:
          description: Sensitivity of an option's price to a 1% change in the implied volatility of the underlying asset. Only present for option markets.
          type: string
          example: "0.05"
    PositionGreeks:
      description: Position greeks for derivative instruments
      type: object
      properties:
        delta:
          description: The sensitivity of the portfolio's value to a change in the underlying price, expressed in the base asset (e.g., BTC, ETH)
          type: string
          example: "0.98000000"
        gamma:
          description: The rate of change in Delta per 1 USDC move in the underlying price, expressed in the base asset
          type: string
          example: "0.01000000"
        theta:
          description: The rate at which the portfolio's value changes as it approaches expiration, expressed in $/day
          type: string
          example: "-0.1700"
        vega:
          description: The change in portfolio value for a 1% (percentage point) absolute change in implied volatility, expressed in dollars ($)
          type: string
          example: "0.0500"
    PortfolioSimulationResponse:
      description: Simulation result
      type: object
      properties:
        collateralUSD:
          description: total collateral across all assets in this trading account displayed in the reference asset in USD
          type: string
          example: "13000.0000"
        borrowedUSD:
          description: total borrowed across all assets in this trading account displayed in the reference asset in USD
          type: string
          example: "12000.0000"
        initialMarginUSD:
          description: The minimum margin one must maintain in order to be able to purposefully increase risk
          type: string
          example: "14000.0000"
        warningMarginUSD:
          description: The minimum margin when the customer will receive warning via email/notifications over UI
          type: string
          example: "15000.0000"
        liquidationMarginUSD:
          description: The minimum value of margin one must maintain in order to avoid liquidation
          type: string
          example: "16000.0000"
        fullLiquidationMarginUSD:
          description: The value of margin when full liquidation occurs
          type: string
          example: "17000.0000"
        defaultedMarginUSD:
          description: The value of margin when this trading account will be moved into a Defaulted state
          type: string
          example: "18000.0000"
        liquidityAddonUSD:
          description: expected market impact of unwinding the portfolio in the case of a liquidation event
          type: string
          example: "19000.0000"
        marketRiskUSD:
          description: the worst possible loss on the portfolio based on scenario analysis
          type: string
          example: "20000.0000"
    FundingRateHistoryResponse:
      description: Hourly Funding Rate History of one market
      type: array
      items:
        type: object
        properties:
          fundingRate:
            description: funding rate for this hour
            type: string
            example: "0.1"
          updatedAtDatetime:
            description: date time of the last funding rate update for the hour
            type: string
            example: "2024-09-16T12:59:59.000Z"
    CreateOtcTradeCommand:
      type: object
      description: A command with details to an OTC trade
      required:
        - commandType
        - sharedMatchKey
        - tradingAccountId
        - isTaker
        - trades
      properties:
        commandType:
          type: string
          description: Specifies the command type and must be ‘V1CreateOtcTrade' to indicate the submission of an OTC trade.
        clientOtcTradeId:
          $ref: "#/components/schemas/ClientOtcTradeId"
        sharedMatchKey:
          $ref: "#/components/schemas/SharedMatchKey"
        tradingAccountId:
          $ref: "#/components/schemas/TradingAccountId"
        isTaker:
          description: denotes whether the role of the counterparty is Taker or Maker. The corresponding leg of the opposite side of the trade should have the inverse role to be successfully matched on the OTC Clearing Facility
          allOf:
