        sharedMatchKey: "a40d0c302d0448ce8e144c8312dd6ef0"
        maker:
          requestId: "100000000000000147"
          otcTradeId: "200000000000000098"
        taker:
          requestId: "100000000000000148"
          otcTradeId: "200000000000000099"
    IdbUpdateRemarksCommand:
      type: object
      description: A command to update IDB remarks of a dual-sided OTC trade using `sharedMatchKey`
      required:
        - commandType
        - sharedMatchKey
        - idbRemarks
      properties:
        commandType:
          type: string
          description: Specifies the command type and must be 'V1IdbUpdateRemarks' to indicate the update of IDB remarks for a dual-sided OTC trade
        sharedMatchKey:
          $ref: "#/components/schemas/SharedMatchKey"
        idbRemarks:
          $ref: "#/components/schemas/IdbRemarks"
      example:
        commandType: "V1IdbUpdateRemarks"
        sharedMatchKey: "a40d0c302d0448ce8e144c8312dd6ef0"
        idbRemarks: "resubmitted by xyz"
    IdbUpdateRemarksResponse:
      description: A response for an acknowledged OTC command to update IDB remarks of a dual-sided OTC trade
      required:
        - message
        - sharedMatchKey
        - maker
        - taker
      properties:
        message:
          type: string
          description: message indicating the status of the request
          example: Command acknowledged - IdbUpdateRemarks
        sharedMatchKey:
          type: string
          description: system-generated unique identifier for the dual-sided brokered OTC trade
          example: a40d0c302d0448ce8e144c8312dd6ef0
        maker:
          $ref: "#/components/schemas/IdbRequestItem"
        taker:
          $ref: "#/components/schemas/IdbRequestItem"
      example:
        message: Command acknowledged - IdbUpdateRemarks
        sharedMatchKey: "a40d0c302d0448ce8e144c8312dd6ef0"
        maker:
          requestId: "100000000000000147"
          otcTradeId: "200000000000000098"
        taker:
          requestId: "100000000000000148"
          otcTradeId: "200000000000000099"
    GetMmpConfigurationResponse:
      type: object
      required:
        - tradingAccountId
        - message
        - mmpConfigurations
      properties:
        tradingAccountId:
          allOf:
            - $ref: "#/components/schemas/TradingAccountId"
        message:
          description: If there are no market maker protection configurations setup for this trading account or for the provided optional symbol under the same trading account, this field will be returned as "No mmp config setup".
          type: string
          example: "No mmp config setup"
        mmpConfigurations:
          description: A list of market maker protection configurations that the user has setup for each underlying asset symbol under the trading account provided. Supports filtering of symbol.
          type: array
          minItems: 0
          items:
            $ref: "#/components/schemas/MmpConfiguration"
    MmpConfiguration:
      type: object
      required:
        - underlyingAssetSymbol
        - windowTimeInSeconds
        - frozenTimeInSeconds
        - quantityLimit
        - deltaLimit
        - isActive
      properties:
        underlyingAssetSymbol:
          type: string
          description: Underlying Asset Symbol
          example: "BTC"
        windowTimeInSeconds:
          type: integer
          description: Time window during which the MMP checks are conducted. It helps in determining how frequently the system evaluates the market maker's activity against predefined thresholds. Value needs to be `> 0`. Maximum value is 600 seconds (10 minutes).
          example: 60
        frozenTimeInSeconds:
          type: integer
          description: The duration for which a market maker's trading activity is temporarily halted after a protective measure is triggered. Value needs to be `>= 0`. Maximum value is 3600 seconds (60 minutes).
          example: 120
        quantityLimit:
          type: string
          description: Cap on the total number of contracts that a market maker can trade within `windowTimeInSeconds`. This is direction(side) agnostic. Needs to be `> 0` if set.
          example: "100"
        deltaLimit:
          type: string
          description: Net delta exposure that a market maker can accumulate within `windowTimeInSeconds`
          example: "10"
        isActive:
          type: boolean
          description: This boolean indicates if this configuration is in effect or not.
          example: true
    MarketExpiryPriceResponse:
      type: object
      required:
        - symbol
        - expiryPrice
        - expiryNotional
        - expiryDatetime
        - expiryTimestamp
      properties:
        symbol:
          type: string
          description: Market Symbol
          example: "BTC-USDC-20250912-95000-C"
        expiryPrice:
          type: string
          description: Price used upon Expiry for an Options/Dated Futures contract
          example: "115123.2512"
        expiryNotional:
          type: string
          description: Difference between strike price and expiry price for an Options contract expressed in notional per unit contract
          example: "20123.3033"
        expiryDatetime:
          type: string
          description: Datetime by which the market expires at
          example: "2018-11-18T00:00:00.000Z"
        expiryTimestamp:
          type: string
          description: Timestamp by which the market expires at
          example: "1672041600000"
