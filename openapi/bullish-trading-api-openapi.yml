            application/json:
              schema:
                $ref: "#/components/schemas/BadOtcTradeEntryResponse"
        "403":
          description: Forbidden- You do not have access to the requested resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadOtcTradeEntryResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadOtcTradeEntryResponse"
      security:
        - jwtTokenAuth: []
  /v2/idb/otc-command#update-remarks:
    post:
      x-position: 5
      summary: IDB Update Remarks
      operationId: idb-otc-command-update-remarks
      description: |
        Update the IDB remarks of a previously initiated OTC trade.

        Submits a command to the trading engine. A successful response indicates that the command entry was acknowledged
        but does not indicate that the command was executed.
        This endpoint uses the [signing format](/rest/authentication#signing-format) which does not require strict field
        ordering and addition of null fields in the request body.

        Command schemas and examples are provided below. Supported commands:
        - V1IdbUpdateRemarks

        - requires [bearer token](/rest/authentication#add-authenticated-request-header) in authorization header
      tags:
        - idb
      parameters:
        - $ref: "#/components/parameters/BX-SIGNATURE"
        - $ref: "#/components/parameters/BX-TIMESTAMP"
        - $ref: "#/components/parameters/BX-NONCE"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              discriminator:
                propertyName: commandType
                mapping:
                  V1IdbUpdateRemarks: "#/components/schemas/IdbUpdateRemarksCommand"
              oneOf:
                - $ref: "#/components/schemas/IdbUpdateRemarksCommand"
            examples:
              IdbUpdateRemarks:
                $ref: "#/components/examples/IdbUpdateRemarksCommand"
      responses:
        "200":
          description: Status OK. This means a command was successfully acknowledged.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/IdbUpdateRemarksResponse"
              examples:
                IdbUpdateRemarksResponse:
                  $ref: "#/components/examples/IdbUpdateRemarksResponse"
        "400":
          description: |
            Bad Request

            For example, sending a request with the `BX-SIGNATURE` header missing will result in the following response:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadOtcTradeEntryResponse"
        "401":
          description: Unauthorized. Either API details are missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadOtcTradeEntryResponse"
        "403":
          description: Forbidden- You do not have access to the requested resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadOtcTradeEntryResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadOtcTradeEntryResponse"
      security:
        - jwtTokenAuth: []
  /v1/expiry-prices/{symbol}:
    get:
      summary: Get Expiry Prices
      operationId: get-expiry-prices--symbol
      description: Retrieves Expiry Price and Expiry Notional for respective Options and Dated Futures markets.
      tags:
        - derivatives-public
      parameters:
        - in: path
          name: symbol
          schema:
            $ref: "#/components/schemas/DerivativeMarketSymbol"
          required: true
      responses:
        "200":
          description: Retrieve expiry price and expiry notional for options and dated future.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketExpiryPriceResponse"
        "400":
          description: Expiry price for market is not (yet) available
        "500":
          description: Internal Server Error
        "404":
          description: Invalid symbol provided
  /v1/markets/{symbol}/auctions:
    get:
      parameters:
        - in: path
          name: symbol
          schema:
            $ref: "#/components/schemas/MarketSymbol"
          required: true
          description: market symbol, e.g. BTCUSDC
      tags:
        - auction-public
      summary: Get Auction by Symbol
      description: Get current auction information and phase for a symbol.
      operationId: getAuctionBySymbol
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Auction"
        "400":
          description: Bad Request
        "404":
          description: Symbol not found or auction not available
        "500":
          description: Internal Server Error
      security: []
  /v1/markets/{symbol}/auctions/noii:
    get:
      parameters:
        - in: path
          name: symbol
          schema:
            $ref: "#/components/schemas/MarketSymbol"
          required: true
          description: market symbol, e.g. BTCUSDC
      tags:
        - auction-public
      summary: Get Auction Net Order Imbalance Indicator
      description: |
        Get NOII (Net Order Imbalance Indicator) snapshot. Available during Lockdown phase only.
        Returns empty array in other phases.
      operationId: getAuctionNoii
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuctionNoii"
        "400":
          description: Bad Request
        "404":
          description: Symbol not found or auction not available
        "500":
          description: Internal Server Error
      security: []
  /v1/history/markets/{symbol}/auctions:
    get:
      parameters:
        - in: path
          name: symbol
          schema:
            $ref: "#/components/schemas/MarketSymbol"
          required: true
          description: market symbol, e.g. BTCUSDC
        - in: query
          name: createdAtDatetime[gte]
          description: start timestamp of period, ISO 8601 with millisecond as string
          schema:
            $ref: "#/components/schemas/DateTime"
          required: false
        - in: query
          name: createdAtDatetime[lte]
          description: end timestamp of period, ISO 8601 with millisecond as string
          schema:
            $ref: "#/components/schemas/DateTime"
          required: false
      tags:
        - market-history-data
      summary: Get Historical Auction Results
      description: |
        Get historical auction results for a symbol.
        - [supports pagination](/rest/general/pagination)
        - filtering on `createdAtDatetime` requires additional keywords, [see filtering support](/rest/general/filtering)
      operationId: getHistoricalAuctionResults
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                minItems: 0
                maxItems: 25
                items:
                  $ref: "#/components/schemas/AuctionResult"
        "400":
          description: Bad Request
        "404":
          description: Symbol not found
        "500":
          description: Internal Server Error
      security: []
components:
  securitySchemes:
    jwtTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BX-SIGNATURE:
      in: header
      name: BX-SIGNATURE
      description: signature obtained using the [signing format](/rest/authentication#signing-format)
      required: true
      schema:
        type: string
    BX-TIMESTAMP:
      in: header
      name: BX-TIMESTAMP
      description: timestamp is the number of milliseconds since EPOCH
      required: true
      schema:
        type: string
    BX-NONCE:
      in: header
      name: BX-NONCE
      description: nonce is a client side incremented unsigned 64 bit integer
      required: true
      schema:
        type: string
    BX-REFERRER:
      in: header
      name: BX-REFERRER
      description: A numeric referrer id if applicable
      required: false
      schema:
        type: string
    BX-PUBLIC-KEY:
      in: header
      name: BX-PUBLIC-KEY
      description: public key being used to generate the JWT
      required: true
      schema:
        type: string
    BX-NONCE-WINDOW-ENABLED:
      in: header
      name: BX-NONCE-WINDOW-ENABLED
      description: |
        string representation of a boolean value, [enables out-of-order order requests to be processed](/rest/order-processing-create-cancel-request-mechanism)
      schema:
        type: string
        enum:
          - "false"
          - "true"
        default: "false"
  schemas:
    Boolean:
      type: boolean
      format: true or false
      example: true
    MarketTypeOrOptionTypeSortByAsString:
      type: string
      description: Sorting parameter that can have the following string values `"marketType"`, `"optionType"`
      enum:
        - marketType
        - optionType
      example: optionType
    OptionTypeOrExpiryDatetimeSortAsString:
      type: string
      description: Sorting parameter that can have the following string values `"optionType"`, `"expiryDatetime"`
      enum:
        - optionType
        - expiryDatetime
      example: optionType
    MarketTypeAsString:
      type: string
      description: market type can have the following string values `"SPOT"`, `"PERPETUAL"`, `"DATED_FUTURE"`, `"OPTION"`
      enum:
        - SPOT
        - PERPETUAL
        - DATED_FUTURE
        - OPTION
      example: SPOT
    OptionTypeAsString:
      type: string
      description: option type can have the following string values `"CALL"`, `"PUT"`
      enum:
        - CALL
        - PUT
      example: CALL
    OrderTypeAsString:
      type: string
      description: order type can have the following string values `"LMT"`, `"MKT"`, `"STOP_LIMIT"`, `"POST_ONLY"`. `"MKT"` and `"STOP_LIMIT"` are not applicable for Options
      example: "LMT"
    OrderTypeAsStringV2:
      type: string
      description: order type can have the following string values `"LIMIT"`, `"MARKET"`, `"STOP_LIMIT"`, `"POST_ONLY"`. `"MARKET"` and `"STOP_LIMIT"` are not applicable for Options
      example: "LIMIT"
    OrderTypeAsStringAmend:
      type: string
      description: order type can have the following string values `"LIMIT"`, `"POST_ONLY"`
      example: "LIMIT"
    OrderSideAsString:
      type: string
      description: order side can have the following string values `"BUY"`, `"SELL"`
      example: BUY
    OrderTimeInForceAsString:
      type: string
      description: time in force can have the following string values `"GTC"`, `"FOK"`, `"IOC"`, `"GTX"` (Good Till Crossing - for auction orders), see [details](/rest/general/order-type)
      example: "GTX"
    OrderStatusAsString:
      type: string
      description: order status can have the following string values `"OPEN"`, `"CLOSED"`, `"CANCELLED"`, `"REJECTED"`
      example: OPEN
    TimeStampAsString:
      type: string
      format: string
      example: "1621490985000"
      description: unsigned 64 bit integer value which is the number of milliseconds since EPOCH expressed as string
    OrderID:
      type: string
      example: "297735387747975680"
    AMMInstructionID:
      type: string
      example: "297735387747975680"
    RequestID:
      type: string
      example: "197735387747975680"
    OrderHandle:
      description: Unique numeric (i64) identifier generated on the client side expressed as a string value
      type: string
      example: "299834741023572480"
    TradingAccountId:
      description: unique trading account ID
      type: string
      example: "111000000000001"
    MarketID:
      type: string
      example: "10000"
    TradeID:
      type: string
      example: "100020000000000060"
    AssetValue:
      description: see [asset value](/rest/general/price-quantity-precision) format
      type: string
      example: "1.00000000"
    UsdcValue:
      description: see [asset value](/rest/general/price-quantity-precision) format
      type: string
      example: "1.0000"
    UserId:
      type: string
      example: "12345"
      description: Bullish user ID
    TimeStampInSeconds:
      type: integer
      format: int64
      example: 1621490985
      description: number of seconds since EPOCH as integer
    DateTime:
      type: string
      format: date-time
      example: "2025-05-20T01:01:01.000Z"
      description: ISO 8601 with millisecond as string
    OptionExpiryDate:
      type: string
      example: "20250520"
      description: Expiry date of the option market in YYYYMMDD format (e.g. 20250520)
    TimeStamp:
      type: string
      format: int64
      example: "1621490985000"
      description: number of milliseconds since EPOCH as string
    CustodyDestinationID:
      type: string
      example: "1560ec0b406c0d909bb9f5f827dd6aa14a1f638884f33a2a3134878102e78038"
      description: destination id provided by bullish that uniquely identifies a whitelisted address or account
    CustodyDestinationUserWalletType:
      type: string
      enum:
        - HOSTED
        - SELF_HOSTED
        - UNKNOWN
      description: The host type of the wallet. `HOSTED` wallet uses a custodial wallet service, `SELF_HOSTED` wallet is a non-custodial wallet.
    CustodyDestinationSigned:
      type: boolean
      example: true
      description: Whether this destination has been signed by the user. Some operations such as withdrawal requires the destination to be signed.
    CustodyDestinationLocked:
      type: boolean
      example: true
      description: Whether this destination is currently in a withdrawal lock period. Addresses are locked upon whitelisting for a 24-hour security period.
    CustodyLockExpiryDateTime:
      type: string
      format: date-time
      example: "2026-06-24T12:00:00Z"
      description: ISO 8601 Zulu timestamp of when the withdrawal lock period expires. Applies only when `locked` is true.
    CustodyDestinationVaspName:
      type: string
      example: Bullish
      description: The name of the hosting VASP of the wallet. This is only applicable for `HOSTED` wallets.
    CustodySelfHostedRequestedDepositAmount:
      type: string
      example: "12.3456"
      description: User-requested amount for the deposit.
    CustodySelfHostedVerificationAmount:
      type: string
      example: "0.0012"
      description: Bullish specified additional small deposit amount to add to the `requestedDepositAmount` for wallet verification.
    CustodySelfHostedDepositAddress:
      type: string
      example: "0xb0a64d976972d87b0783eeb1ff88306cd1891f02"
      description: The address of the Bullish trading account that the user should deposit to during a self hosted deposit attempt.
    CustodySelfHostedDepositMemo:
      type: string
      example: MZAXEMRXA
      description: The memo or destination tag of the Bullish trading account that the user should deposit to during a self hosted deposit attempt.
    CustodySelfHostedTotalDepositAmount:
      type: string
      example: "12.3468"
      description: The actual amount that the user should deposit for wallet verification. It is the sum of `requestedDepositAmount` and `verificationAmount`.
    CustodySelfHostedVerificationStatus:
      type: string
      enum:
        - VERIFIED
        - PENDING_VERIFICATION
        - VERIFICATION_EXPIRED
      description: |
        The status for the self-hosted wallet verification attempt.
        - `VERIFIED` - Self-hosted wallet has been verified
        - `PENDING_VERIFICATION` - pending verification via satoshi test
        - `VERIFICATION_EXPIRED` - the verification has expired
    NetworkID:
      type: string
      example: "ETH"
      description: the network of the native coin or token, e.g. BTC, ETH, SOL
    CustodyNetworkAddress:
      type: string
      example: "0xb0a64d976972d87b0783eeb1ff88306cd1891f02"
      description: an address on the given network
    CustodySymbol:
      type: string
      example: "USDC"
      description: symbol representing coin or token, e.g. USDC, BTC, ETH, SHIB
    CustodyFiatSymbol:
      type: string
      example: "USD"
      description: symbol representing fiat currency, e.g. USD, EUR
    CustodyTransactionID:
      type: string
      example: "DB:9e6304a08c9cc2a33e6bc6429a088eae2a6b940c8e312aede3a3780257b9b979"
      description: unique identifier for tracking a withdrawal during signing and in history
    CustodyTransactionHistoryID:
      type: string
      example: "DB:9e6304a08c9cc2a33e6bc6429a088eae2a6b940c8e312aede3a3780257b9b979"
      description: unique identifier for tracking a deposit or withdrawal
    CustodyDirection:
      type: string
      example: "DEPOSIT"
      description: direction of transaction from API user's perspective, 'DEPOSIT' or 'WITHDRAWAL'
    CustodyBankName:
      type: string
      example: Silvergate Bank
      description: name of bank
    CustodyPhysicalBankAddress:
      type: string
      description: physical location of bank
      example: 4250 Executive Square Suite 300 La Jolla, CA 92037
    CustodyBankAccountNumber:
      type: string
      description: bank account number
      example: "9873481227"
    CustodyBankNetworkID:
      type: string
      description: the fiat network, e.g. SWIFT, ABA or SEPA
      example: SWIFT
    CustodyBankRoutingCode:
      type: string
      description: routing code of bank
      example: "322286803"
    CustodyQuantity:
      type: string
      description: total quantity of symbol to withdraw including fee in units of symbol, not in smaller denominations (e.g. BTC not Satoshi, ETH not Wei) - quantity received will have fee subtracted.
      example: "100000.00"
    CustodyWithdrawalFee:
      type: string
      example: "3.00"
      description: withdrawal fee charged in units of symbol, not in smaller denominations (e.g. BTC not Satoshi, ETH not Wei)
    CustodyDepositMemo:
      type: string
      example: "925891241"
      description: memo or destination tag used during deposit to help identify account to credit funds to
    CustodyMinimumDepositAmount:
      type: string
      example: "0.01"
      description: the minimum deposit amount required for this symbol and network. Deposits under this amount will not be credited to your account
    CustodyWithdrawalMemo:
      type: string
      example: MZAXEMRXA
      description: memo or destination tag that will be used as a reference on transaction
    CustodyWithdrawalLabel:
      type: string
      example: Our cold wallet
      description: descriptive label of destination provided by user
    CustodyTransactionStatus:
      type: string
      example: "COMPLETE"
      description: one of 'PENDING', 'COMPLETE', 'CANCELLED', 'FAILED'
    CustodyTransactionDetails:
      type: object
      properties:
        address:
          type: string
          description: crypto network address
          example: "0xb0a64d976972d87b0783eeb1ff88306cd1891f02"
        blockchainTxId:
          type: string
          description: transaction id on chain
          example: "0xec557f2c7278d2dae2d98a27b9bd43f386789a4209090cbbd11595f1bed4a4c2"
        swiftUetr:
          type: string
          description: unique end-to-end-transaction reference for swift transactions
          example: b55aa5cd-baa2-4122-8c17-ae9b856ae36a
    CustodyAvailableWithdrawalLimit:
      type: string
      example: "20000.0"
      description: remaining limit on amount of coin or token that could be withdrawn now, in units of the symbol itself, not in smaller denominations (e.g. BTC not Satoshi, ETH not Wei)
    Custody24HWithdrawalLimit:
      type: string
      example: "1000000.00"
      description: limit on amount of coin or token that can be withdrawn over a 24 hour period, in units of the symbol itself, not in smaller denominations (e.g. BTC not Satoshi, ETH not Wei)
    CustodyCreatedAtDateTime:
      type: string
      example: "2022-09-16T07:56:15.000Z"
      description: time of initial transaction
    PublicKey:
      type: string
      example: PUB_R1_6PTdfWbXvXWQduhcCiRooGHTVpriu15xMqfr7EDq6sWLDj7NjS
    Signature:
      type: string
      example: SIG_R1_K35d5hSY5FbNoJwrCfmH6QvPG7m9XmhL2mgWYcSB7q2hKJ2mv39Luck9WBJroSB635ZAXhdg36TYG7QJX1fTidbsMvyE8N
    AssetAccount:
      type: object
      required:
        - tradingAccountId
        - assetId
        - assetSymbol
        - availableQuantity
        - borrowedQuantity
        - lockedQuantity
        - loanedQuantity
        - updatedAtDatetime
        - updatedAtTimestamp
      properties:
        tradingAccountId:
          allOf:
            - $ref: "#/components/schemas/TradingAccountId"
        assetId:
          description: asset ID
          allOf:
            - $ref: "#/components/schemas/AssetID"
        assetSymbol:
          description: asset symbol
          allOf:
            - $ref: "#/components/schemas/AssetSymbol"
        availableQuantity:
          description: the assets that are available to use on the account, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        borrowedQuantity:
          description: the assets on the account that are borrowed, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        lockedQuantity:
          description: the assets on the account that are locked in orders, loans and AMM instructions, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        loanedQuantity:
          description: the assets on the account that are being loaned, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        updatedAtDatetime:
          description: denotes the time the AMM instruction was updated by the exchange, ISO 8601 with millisecond as string
          allOf:
            - $ref: "#/components/schemas/DateTime"
        updatedAtTimestamp:
          description: denotes the time the AMM instruction was updated by the exchange
          allOf:
            - $ref: "#/components/schemas/TimeStampAsString"
    CreateOrderCommandResponseV3:
      type: object
      required:
        - message
        - requestId
        - orderId
      properties:
        message:
          description: message
          type: string
        requestId:
          description: unique request ID
          allOf:
            - $ref: "#/components/schemas/RequestID"
        orderId:
          description: unique order ID
          allOf:
            - $ref: "#/components/schemas/OrderID"
        clientOrderId:
          description: unique numeric identifier generated on the client side expressed as a string value
          type: string
      example:
        message: "Command acknowledged - CreateOrder"
        requestId: "633910976353665024"
        orderId: "633910775316480001"
        clientOrderId: "1234567"
    AmendOrderCommandResponseV1:
      type: object
      required:
        - commandType
        - message
        - requestId
        - orderId
      properties:
        commandType:
          description: The command type
          type: string
          enum:
            - V1AmendOrder
        message:
          description: message
          type: string
        requestId:
          description: unique request ID
          allOf:
            - $ref: "#/components/schemas/RequestID"
        orderId:
          description: unique order ID
          allOf:
            - $ref: "#/components/schemas/OrderID"
        clientOrderId:
          description: Will be updated as part of a successful order amendment
          type: string
      example:
        commandType: "V1AmendOrder"
        message: "Command acknowledged - AmendOrder"
        requestId: "633910976353665024"
        orderId: "633910775316480001"
        clientOrderId: "1234567-1"
    CancelOrderCommandResponseV3:
      type: object
      required:
        - commandType
        - message
        - requestId
      properties:
        commandType:
          description: The command type
          type: string
          enum:
            - V3CancelOrder
        message:
          description: message
          type: string
        requestId:
          description: unique request ID
          allOf:
            - $ref: "#/components/schemas/RequestID"
        orderId:
          description: unique order ID
          allOf:
            - $ref: "#/components/schemas/OrderID"
        clientOrderId:
          description: unique numeric identifier generated on the client side expressed as a string value
          type: string
      example:
        commandType: "V3CancelOrder"
        message: "Command acknowledged - CancelOrder"
        requestId: "633910976353665024"
        orderId: "633910775316480001"
    CancelAllOrdersCommandResponse:
      type: object
      required:
        - commandType
        - message
        - requestId
      properties:
        commandType:
          description: The command type
          type: string
          enum:
            - V1CancelAllOrders
        message:
          description: message
          type: string
        requestId:
          description: unique request ID
          allOf:
            - $ref: "#/components/schemas/RequestID"
      example:
        commandType: "V1CancelAllOrders"
        message: "Command acknowledged - CancelAllOrders"
        requestId: "633910976353665024"
    DelayedCancelAllOrdersResponse:
      type: object
      required:
        - commandType
        - message
        - requestId
      properties:
        commandType:
          description: The command type
          type: string
          enum:
            - V1DelayedCancelAllOrders
        message:
          description: message
          type: string
        requestId:
          description: unique request ID
          allOf:
            - $ref: "#/components/schemas/RequestID"
      example:
        commandType: "V1DelayedCancelAllOrders"
        message: "Command acknowledged - DelayedCancelAllOrders"
        requestId: "633910976353665024"
    UnsetDelayedCancelAllOrdersResponse:
      type: object
      required:
        - commandType
        - message
        - requestId
      properties:
        commandType:
          description: The command type
          type: string
          enum:
            - V1UnsetDelayedCancelAllOrders
        message:
          description: message
          type: string
        requestId:
          description: unique request ID
          allOf:
            - $ref: "#/components/schemas/RequestID"
      example:
        commandType: "V1UnsetDelayedCancelAllOrders"
        message: "Command acknowledged - UnsetDelayedCancelAllOrders"
        requestId: "633910976353665024"
    CreateOrderCommandV3:
      type: object
      required:
        - commandType
        - symbol
        - type
        - side
        - quantity
        - timeInForce
        - tradingAccountId
      properties:
        commandType:
          description: The command type, it must be 'V3CreateOrder'
          type: string
        clientOrderId:
          allOf:
            - $ref: "#/components/schemas/OrderHandle"
        symbol:
          allOf:
            - $ref: "#/components/schemas/MarketSymbol"
        type:
          allOf:
            - $ref: "#/components/schemas/OrderTypeAsStringV2"
        side:
          allOf:
            - $ref: "#/components/schemas/OrderSideAsString"
        price:
          description: price
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        stopPrice:
          description: stop price
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        quantity:
          description: quantity
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        timeInForce:
          allOf:
            - $ref: "#/components/schemas/OrderTimeInForceAsString"
        allowBorrow:
          description: allows to borrow on the order
          type: boolean
