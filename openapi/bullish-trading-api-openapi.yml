paths:
  /v1/nonce:
    get:
      tags:
        - general
      summary: Get Current Nonce Range
      description: |
        Get the current nonce range. The lower bound of nonce range is EPOCH start of day in microseconds, and upper bound of nonce range is EPOCH end of day in microseconds.

        **Ratelimited:** `False`
      operationId: getNonce
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nonce"
        "401":
          description: Not Authenticated
        "403":
          description: Access Forbidden
        "429":
          description: Too Many Requests
        "500":
          description: Internal Server Error
      security: []
  /v1/users/logout:
    get:
      x-position: 3
      tags:
        - session-management
      summary: Logout
      description: |
        Logout of the session associated with the JWT. It requires [bearer token](/rest/authentication#add-authenticated-request-header) in authorization header. 

        **Ratelimited:** `True`
      operationId: logoutUser
      responses:
        "200":
          description: OK
        "401":
          description: Not Authenticated
        "403":
          description: Access Forbidden
        "429":
          description: Too Many Requests
        "500":
          description: Internal Server Error
      security:
        - jwtTokenAuth: []
  /v2/users/login:
    post:
      x-position: 1
      tags:
        - session-management
      summary: Login
      description: |
        Login and generate a new session associated with a JWT. Once you log in from an IP, the same IP must be used for 
        the duration of the session for any subsequent requests.

        **Ratelimited:** `True`
      operationId: loginUserV2
      responses:
        "200":
          description: returns JWT and the `authorizer` for signing requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Bad Request
        "401":
          description: Not Authenticated
        "403":
          description: Access Forbidden
        "429":
          description: Too Many Requests
        "500":
          description: Internal Server Error
      requestBody:
        description: login request body
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      security: []
  /v1/users/hmac/login:
    get:
      x-position: 2
      tags:
        - session-management
      summary: HMAC Login
      description: |
        Login and generate a new session associated with a JWT using HMAC. Once you log in from an IP, the same IP must
        be used for the duration of the session for any subsequent requests.

        **Ratelimited:** `True`
      operationId: loginUserHmac
      parameters:
        - $ref: "#/components/parameters/BX-SIGNATURE"
        - $ref: "#/components/parameters/BX-TIMESTAMP"
        - $ref: "#/components/parameters/BX-NONCE"
        - $ref: "#/components/parameters/BX-PUBLIC-KEY"
      responses:
        "200":
          description: returns JWT and the `authorizer` for signing requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Bad Request
        "401":
          description: Not Authenticated
        "403":
          description: Access Forbidden
        "429":
          description: Too Many Requests
        "500":
          description: Internal Server Error
      security: []
  /v1/accounts/trading-accounts:
    get:
      tags:
        - trading-accounts
      summary: Get All Trading Accounts Details
      description: |
        Gets details for all trading accounts accessible by the API key used in the request. It requires [bearer token](/rest/authentication#add-authenticated-request-header) in authorization header. The trading account's id will be used in all other REST API

        **Ratelimited:** `True`
      operationId: getTradingAccounts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                minItems: 0
                maxItems: 25
                items:
                  $ref: "#/components/schemas/TradingAccountResponse"
        "401":
          description: Not Authenticated
        "403":
          description: Access Forbidden
        "429":
          description: Too Many Requests
        "500":
          description: Internal Server Error
      security:
        - jwtTokenAuth: []
  /v1/accounts/trading-accounts/{tradingAccountId}:
    get:
      tags:
        - trading-accounts
      summary: Get Trading Account Details by ID
      description: |
        Gets details for specific trading account by `tradingAccountId` and API key used in the request. It requires [bearer token](/rest/authentication#add-authenticated-request-header) in authorization header.

        **Ratelimited:** `True`
      operationId: getTradingAccountById
      parameters:
        - in: path
          name: tradingAccountId
          description: Id of the trading account
          schema:
            $ref: "#/components/schemas/TradingAccountId"
          required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingAccountResponse"
        "400":
          description: Bad Request Parameter
        "401":
          description: Not Authenticated
        "403":
          description: Access Forbidden
        "404":
          description: Resource Not Found
        "429":
          description: Too Many Requests
        "500":
          description: Internal Server Error
      security:
        - jwtTokenAuth: []

  /v1/accounts/asset:
    get:
      tags:
        - account-assets
      summary: Get All Account Assets
      description: |
        Gets the asset accounts, requires [bearer token](/rest/authentication#add-authenticated-request-header) in authorization header

        **Ratelimited:** `True`
      operationId: getAssetAccounts
      parameters:
        - in: query
          name: tradingAccountId
          description: Id of the trading account
          schema:
            $ref: "#/components/schemas/TradingAccountId"
          required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                minItems: 0
                maxItems: 10
                items:
                  $ref: "#/components/schemas/AssetAccount"
        "401":
          description: Not Authenticated
        "403":
          description: Access Forbidden
        "429":
          description: Too Many Requests
        "500":
          description: Internal Server Error
      security:
        - jwtTokenAuth: []
  /v1/accounts/asset/{symbol}:
    get:
      parameters:
        - in: path
          name: symbol
          schema:
            $ref: "#/components/schemas/AssetSymbol"
          required: true
        - in: query
          name: tradingAccountId
          description: Id of the trading account
          schema:
            $ref: "#/components/schemas/TradingAccountId"
          required: true
      tags:
        - account-assets
      summary: Get All Account Assets by Symbol
      description: |
        Gets the asset account by symbol, requires [bearer token](/rest/authentication#add-authenticated-request-header) in authorization header

        **Ratelimited:** `True`
      operationId: getAssetAccountBySymbol
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetAccount"
        "401":
          description: Not Authenticated
        "403":
          description: Access Forbidden
        "404":
          description: Resource Not Found
        "429":
          description: Too Many Requests
        "500":
          description: Internal Server Error
      security:
        - jwtTokenAuth: []

  /v2/orders:
    get:
      x-position: 1
      tags:
        - orders
      summary: Get Orders
      description: |
        Retrieve a list of orders placed by a trading account with specified filters.
        - Only the last 24 hours of data is available for querying

        This endpoint requires [authentication](/rest/authentication#generate-a-jwt-token) and supports [pagination](/rest/general/pagination).
        To filter by `createdAtDatetime` and `createdAtTimestamp`, additional parameters are required. For detailed instructions, see the [Filtering Support](/rest/general/filtering) section.
        Additionally, this endpoint is subjected to rate limiting.
      operationId: getOrdersV2
      parameters:
        - in: query
          name: symbol
          schema:
            $ref: "#/components/schemas/MarketSymbol"
          required: false
        - in: query
          name: clientOrderId
          description: Unique numeric (i64) identifier generated on the client
            side expressed as a string value
          schema:
            $ref: "#/components/schemas/OrderHandle"
          required: false
        - in: query
          name: side
          description: order side
          schema:
            $ref: "#/components/schemas/OrderSide"
          required: false
        - in: query
          name: status
          description: order status
          schema:
            $ref: "#/components/schemas/OrderStatus"
          required: false
        - in: query
          name: tradingAccountId
          description: Id of the trading account
          schema:
            $ref: "#/components/schemas/TradingAccountId"
          required: true
        - in: query
          name: isAuctionOrder
          description: Filter orders by auction type. `true` returns auction orders (GTX) only, `false` returns non-auction orders only. Omit to return all orders
          schema:
            type: boolean
          required: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                minItems: 0
                maxItems: 10
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: Not Authenticated
        "403":
          description: Access Forbidden
        "429":
          description: Too Many Requests
        "500":
          description: Internal Server Error
      security:
        - jwtTokenAuth: []
    post:
      x-position: 4
      tags:
        - orders
      summary: Create Order
      description: |
        Creates an order, requires [bearer token](/rest/authentication#add-authenticated-request-header) in authorization header.

        This endpoint uses the [signing format](/rest/authentication#signing-format) which does not require strict field ordering 
        and addition of null fields in the request body. Quantities and prices does not require strict precision. 
        E.g. for asset precision of 4 - `100`, `100.0`, `100.00`, `100.000` and `100.0000` are all accepted.

        **Ratelimited:** `True`. Higher tiers of rate limits available by providing the `BX-RATELIMIT-TOKEN` request header.
      operationId: createOrderV2
      parameters:
        - $ref: "#/components/parameters/BX-SIGNATURE"
        - $ref: "#/components/parameters/BX-TIMESTAMP"
        - $ref: "#/components/parameters/BX-NONCE"
        - $ref: "#/components/parameters/BX-NONCE-WINDOW-ENABLED"
        - $ref: "#/components/parameters/BX-REFERRER"
      responses:
        "200":
          description: Status OK. The create order command was successfully
            acknowledged. To check the current status of the order, query [Get
            Order by ID](/rest/api/get-order-by-id-v-2) using the
            `orderId` received in the response payload. Please consult the
            section [How To Ensure The Order Of *Create Order* or *Cancel Order*
            Requests](/rest/order-processing-create-cancel-request-mechanism)
            for more information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderCommandResponseV3"
        "400":
          description: |
            Bad Request

            For example, sending a request with the `BX-SIGNATURE` header missing will result in the following response:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadOrderEntryResponse"
        "401":
          description: Not Authenticated
        "403":
          description: Access Forbidden
        "429":
          description: Too Many Requests
        "500":
          description: Internal Server Error
      requestBody:
        description: new order request body
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderCommandV3"
            examples:
              CreateLimitOrderCommand:
                $ref: "#/components/examples/CreateLimitOrderCommand"
              CreateMarketOrderCommand:
                $ref: "#/components/examples/CreateMarketOrderCommand"
              CreateStopLimitOrderCommand:
                $ref: "#/components/examples/CreateStopLimitOrderCommand"
              CreatePostOnlyOrderCommand:
                $ref: "#/components/examples/CreatePostOnlyOrderCommand"
      security:
        - jwtTokenAuth: []
  /v2/orders/{orderId}:
    parameters:
      - in: path
        name: orderId
        schema:
          type: number
        required: true
        description: order ID
    get:
      x-position: 2
      tags:
        - orders
      summary: Get Order by ID
      description: |
        Retrieve a specific order using its unique identifier.

        This endpoint requires [authentication](/rest/authentication#generate-a-jwt-token) and is subjected to rate limiting.
      operationId: getOrderByIdV2
      parameters:
        - in: query
          name: tradingAccountId
          description: Id of the trading account
          schema:
            $ref: "#/components/schemas/TradingAccountId"
          required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found (order ID is invalid)
        "401":
          description: Not Authenticated
        "403":
          description: Access Forbidden
        "429":
          description: Too Many Requests
        "500":
          description: Internal Server Error
      security:
        - jwtTokenAuth: []
  /v2/orders/client-order-id/{clientOrderId}:
    parameters:
      - in: path
        name: clientOrderId
        schema:
          type: number
        required: true
        description: unique numeric (i64) identifier generated on the client side
    get:
      x-position: 3
      tags:
        - orders
      summary: Get Order by clientOrder ID
      description: |
        Retrieve a specific order using its unique identifier generated on the client side.

        This endpoint requires [authentication](/rest/authentication#generate-a-jwt-token) and is subjected to rate limiting.
      operationId: trade-get-order-by-client-order-id-v2
      parameters:
        - in: query
          name: tradingAccountId
          description: Id of the trading account
          schema:
            $ref: "#/components/schemas/TradingAccountId"
          required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Not Authenticated
        "404":
          description: Order not found (clientOrder ID is invalid)
        "403":
          description: Access Forbidden
        "429":
          description: Too Many Requests
        "500":
          description: Internal Server Error
      security:
        - jwtTokenAuth: []
  /v2/history/orders:
    get:
      tags:
        - history
      summary: Get Historical Orders
      description: |
        Retrieve a list of orders placed by a trading account with specified filters.
        - On a single query request you can retrieve data over a 7 day window, with the data available for the last 90 days

        This endpoint requires [authentication](/rest/authentication#generate-a-jwt-token) and supports [pagination](/rest/general/pagination).
        To filter by `createdAtDatetime` and `createdAtTimestamp`, additional parameters are required. For detailed instructions, see the [Filtering Support](/rest/general/filtering) section.
        Additionally, this endpoint is subjected to rate limiting.
      operationId: getOrdersHistoryV2
      parameters:
        - in: query
          name: symbol
          schema:
            $ref: "#/components/schemas/MarketSymbol"
          required: false
        - in: query
          name: orderId
          schema:
            $ref: "#/components/schemas/OrderID"
          required: false
        - in: query
          name: clientOrderId
          description: Unique numeric (i64) identifier generated on the client
            side expressed as a string value
          schema:
            $ref: "#/components/schemas/OrderHandle"
          required: false
        - in: query
          name: side
          description: order side
          schema:
            $ref: "#/components/schemas/OrderSide"
          required: false
        - in: query
          name: status
          description: order status
          schema:
            $ref: "#/components/schemas/OrderStatus"
          required: false
        - in: query
          name: tradingAccountId
          description: Id of the trading account
          schema:
            $ref: "#/components/schemas/TradingAccountId"
          required: true
        - in: query
          name: createdAtDatetime[gte]
          description: start timestamp of period, ISO 8601 with millisecond as
            string
          schema:
            $ref: "#/components/schemas/DateTime"
          required: false
        - in: query
          name: createdAtDatetime[lte]
          description: end timestamp of period, ISO 8601 with millisecond as
            string
          schema:
            $ref: "#/components/schemas/DateTime"
          required: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                minItems: 0
                maxItems: 10
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: Not Authenticated
        "403":
          description: Access Forbidden
        "429":
          description: Too Many Requests
        "500":
          description: Internal Server Error
      security:
        - jwtTokenAuth: []
  /v2/amm-instructions:
    get:
      x-position: 1
      tags:
        - amm-instructions
      summary: Get AMM Instructions
      description: |
        Gets a list of AMM instructions based on applied filters.
        - requires [bearer token](/rest/authentication#add-authenticated-request-header) in authorization header
        - [supports pagination](/rest/general/pagination)

        **Ratelimited:** `True`
      operationId: getAmmInstructions
      parameters:
        - in: query
          name: symbol
          schema:
