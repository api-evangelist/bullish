components:
  securitySchemes:
    jwtTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Authorization:
      in: header
      name: Authorization
      description: authorization header, its value must be 'Bearer ' + [token](/rest/authentication#generate-a-jwt-token)
      required: true
      schema:
        type: string
    BX-SIGNATURE:
      in: header
      name: BX-SIGNATURE
      description: signature obtained using the [signing format](#overview--how-to-ensure-the-order-of-create-order-or-cancel-order-requests)
      required: true
      schema:
        type: string
    BX-TIMESTAMP:
      in: header
      name: BX-TIMESTAMP
      description: timestamp is the number of milliseconds since EPOCH
      required: true
      schema:
        type: string
    BX-NONCE:
      in: header
      name: BX-NONCE
      description: nonce is a client side incremented unsigned 64 bit integer
      required: true
      schema:
        type: string
    BX-NONCE-WINDOW-ENABLED:
      in: header
      name: BX-NONCE-WINDOW-ENABLED
      description: string representation of a boolean value, [enables out-of-order order requests to be processed](/rest/order-processing-create-cancel-request-mechanism)
      required: false
      schema:
        type: string
        enum:
          - "false"
          - "true"
        default: "false"
  schemas:
    Boolean:
      type: boolean
      format: true or false
    OrderTypeAsString:
      type: string
      description: order type can have the following string values `"LMT"`, `"MKT"`, `"STOP_LIMIT"`, `"POST_ONLY"`
      example: "LMT"
    OrderSideAsString:
      type: string
      description: order side can have the following string values `"BUY"`, `"SELL"`
      example: BUY
    OrderTimeInForceAsString:
      type: string
      description: time in force can have the following string values `"GTC"`, `"FOK"`, `"IOC"`, see [details](/rest/general/order-type)
    OrderStatusAsString:
      type: string
      description: order status can have the following string values `"OPEN"`, `"CLOSED"`, `"CANCELLED"`, `"REJECTED"`
      example: OPEN
    TimeStampAsString:
      type: string
      format: string
      example: "1621490985000"
      description: unsigned 64 bit integer value which is the number of milliseconds since EPOCH expressed as string
    NonceAsString:
      type: string
      format: string
      example: "123456789"
      description: the nonce is a client side incremented unsigned 64 bit integer expressed as string
    SpotAccountID:
      type: string
      example: "1"
    OrderID:
      type: string
      example: "297735387747975680"
    AMMInstructionID:
      type: string
      example: "297735387747975680"
    RequestID:
      type: string
      example: "197735387747975680"
    OrderHandle:
      description: Unique numeric (i64) identifier generated on the client side expressed as a string value
      type: string
      example: "187"
    TradingAccountId:
      description: unique trading account ID
      type: string
      example: "111000000000001"
    AssetValue:
      description: see [asset value](/rest/general/price-quantity-precision) format
      type: string
      example: "1.00000000"
    DateTime:
      type: string
      format: date-time
      example: "2021-05-20T01:01:01.000Z"
      description: ISO 8601 with millisecond as string
    SpotAccount:
      type: object
      required:
        - accountId
        - type
        - symbol
        - total
        - free
        - used
        - updatedAtDatetime
        - updatedAtTimestamp
      properties:
        accountId:
          description: unique spot account ID
          allOf:
            - $ref: "#/components/schemas/SpotAccountID"
        type:
          description: Spot Account
          allOf:
            - type: string
              description: Type of Account
              example: spot
        symbol:
          description: asset symbol
          allOf:
            - $ref: "#/components/schemas/AssetSymbol"
        total:
          description: total is `free` + `used` assets within the account, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        free:
          description: refers to the assets that are available to use on the account excluding borrowed assets, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        used:
          description: refers to the assets that are locked in orders ,loans and AMM instructions, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        updatedAtDatetime:
          description: denotes the time the AMM instruction was updated by the exchange, ISO 8601 with millisecond as string
          allOf:
            - $ref: "#/components/schemas/DateTime"
        updatedAtTimestamp:
          description: denotes the time the AMM instruction was updated by the exchange
          allOf:
            - $ref: "#/components/schemas/TimeStampAsString"
    CreateOrderResponse:
      type: object
      required:
        - message
        - requestId
        - orderId
        - test
      properties:
        message:
          description: message
          type: string
          example: "Command acknowledged - CreateOrder"
        requestId:
          description: unique request ID
          allOf:
            - $ref: "#/components/schemas/RequestID"
        orderId:
          description: unique order ID
          allOf:
            - $ref: "#/components/schemas/OrderID"
    CreateOrderCommand:
      type: object
      required:
        - commandType
        - handle
        - symbol
        - type
        - side
        - price
        - stopPrice
        - quantity
        - allowMargin
        - timeInForce
        - tradingAccountId
      properties:
        commandType:
          description: The command type, it must be 'V2CreateOrder'
          type: string
          example: "V2CreateOrder"
        handle:
          allOf:
            - $ref: "#/components/schemas/OrderHandle"
        symbol:
          allOf:
            - $ref: "#/components/schemas/MarketSymbol"
        type:
          allOf:
            - $ref: "#/components/schemas/OrderTypeAsString"
          example: "LMT"
        side:
          allOf:
            - $ref: "#/components/schemas/OrderSideAsString"
          example: "BUY"
        price:
          description: price, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        stopPrice:
          description: stop price, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        quantity:
          description: quantity, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        timeInForce:
          allOf:
            - $ref: "#/components/schemas/OrderTimeInForceAsString"
          example: "GTC"
        allowMargin:
          description: allows to borrow on the order
          type: boolean
          example: false
        tradingAccountId:
          allOf:
            - $ref: "#/components/schemas/TradingAccountId"

    CreateAMMInstructionResponse:
      type: object
      required:
        - message
        - requestId
        - liquidityId
        - test
      properties:
        message:
          description: message
          type: string
          example: "Command acknowledged - AddLiquidity"
        requestId:
          description: unique request ID
          allOf:
            - $ref: "#/components/schemas/RequestID"
        liquidityId:
          description: unique AMM instruction ID
          allOf:
            - $ref: "#/components/schemas/AMMInstructionID"
    BadOrderEntryResponse:
      type: object
      required:
        - message
        - errorCode
        - errorCodeName
      properties:
        message:
          description: message
          type: string
          example: "Missing signature header"
        errorCode:
          description: unique error code
          type: integer
          example: 6029
        errorCodeName:
          description: unique error code name
          type: string
          example: "MISSING_SIGNATURE_HEADER"
    CreateAMMInstructionCommand:
      type: object
      required:
        - commandType
        - symbol
        - baseQuantity
        - quoteQuantity
        - upperBound
        - lowerBound
        - feeTierId
        - tradingAccountId
      properties:
        commandType:
          description: The command type, it must be 'V2AddLiquidity'
          type: string
          example: "V2AddLiquidity"
        symbol:
          allOf:
            - $ref: "#/components/schemas/MarketSymbol"
        baseQuantity:
          description: base quantity, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        quoteQuantity:
          description: quote quantity, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        upperBound:
          type: string
          description: upper bound of price range, in quote currency
          example: "14000.0000"
        lowerBound:
          type: string
          description: lower bound of price range, in quote currency
          example: "12000.0000"
        feeTierId:
          allOf:
            - $ref: "#/components/schemas/FeeTierId"
        tradingAccountId:
          allOf:
            - $ref: "#/components/schemas/TradingAccountId"
    CancelAllOrdersRequest:
      type: object
      required:
        - timestamp
        - nonce
        - authorizer
        - command
      properties:
        timestamp:
          allOf:
            - $ref: "#/components/schemas/TimeStampAsString"
        nonce:
          allOf:
            - $ref: "#/components/schemas/NonceAsString"
        authorizer:
          description: JWT authorizer you obtain along with the [JWT token](/rest/authentication#generate-a-jwt-token)
          allOf:
            - $ref: "#/components/schemas/Authorizer"
        command:
          description: the command to be executed which is sent in the request payload
          allOf:
            - $ref: "#/components/schemas/CancelAllOrdersCommand"
    CancelAllOrdersCommand:
      type: object
      required:
        - commandType
        - tradingAccountId
      properties:
        commandType:
          description: The command type, it must be 'V1CancelAllOrders'
          type: string
        tradingAccountId:
          description: unique trading account Id
