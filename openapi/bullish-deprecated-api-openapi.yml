    Order:
      type: object
      required:
        - orderId
        - handle
        - clientOrderId
        - symbol
        - price
        - stopPrice
        - averageFillPrice
        - margin
        - allowBorrow
        - quantity
        - quantityFilled
        - quoteAmount
        - baseFee
        - quoteFee
        - borrowedQuantity
        - borrowedBaseQuantity
        - borrowedQuoteQuantity
        - isLiquidation
        - side
        - type
        - timeInForce
        - status
        - statusReason
        - statusReasonCode
        - createdAtTimestamp
        - createdAtDatetime
      properties:
        handle:
          deprecated: true
          allOf:
            - $ref: "#/components/schemas/OrderHandle"
        clientOrderId:
          allOf:
            - $ref: "#/components/schemas/OrderHandle"
        orderId:
          description: unique order ID
          allOf:
            - $ref: "#/components/schemas/OrderID"
        symbol:
          description: market symbol
          allOf:
            - $ref: "#/components/schemas/MarketSymbol"
        price:
          description: price, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        averageFillPrice:
          description: average fill price, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        stopPrice:
          description: stop price, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        margin:
          description: indicates if the order was allowed to borrow (does not indicate that borrowing occurred)
          type: boolean
          deprecated: true
          example: false
        allowBorrow:
          description: indicates if the order was allowed to borrow (does not indicate that borrowing occurred)
          type: boolean
          example: false
        quantity:
          description: quantity, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        quantityFilled:
          description: quantity filled, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        quoteAmount:
          description: quote quantity deducted from asset account, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        baseFee:
          description: base fee, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        quoteFee:
          description: quote fee, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        borrowedQuantity:
          deprecated: true
          description: quantity borrowed, see [asset value](/rest/general/price-quantity-precision) format - BUY order borrows quote, SELL order borrows base
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        borrowedBaseQuantity:
          description: quantity borrowed, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        borrowedQuoteQuantity:
          description: quantity borrowed, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        isLiquidation:
          description: indicates if the order was executed as a liquidation order
          type: boolean
          example: false
        side:
          description: order side
          allOf:
            - $ref: "#/components/schemas/OrderSideAsString"
          example: "BUY"
        type:
          description: order type
          allOf:
            - $ref: "#/components/schemas/OrderTypeAsString"
          example: "LMT"
        timeInForce:
          description: time in force
          allOf:
            - $ref: "#/components/schemas/OrderTimeInForceAsString"
          example: "GTC"
        status:
          description: order status
          allOf:
            - $ref: "#/components/schemas/OrderStatusAsString"
          example: "OPEN"
        statusReason:
          description: status reason, describes why the order is in a specific state
          type: string
          example: "User cancelled"
        statusReasonCode:
          description: status reason code, see [details](/rest/general/error-rejection-codes)
          type: string
          example: "1002"
        createdAtDatetime:
          description: denotes the time the order was ACK'd by the exchange, ISO 8601 with millisecond as string
          allOf:
            - $ref: "#/components/schemas/DateTime"
        createdAtTimestamp:
          description: denotes the time the order was ACK'd by the exchange
          allOf:
            - $ref: "#/components/schemas/TimeStampAsString"
    AMMInstruction:
      type: object
      required:
        - apy
        - baseCurrentQuantity
        - baseFee
        - baseInvestQuantity
        - basePrice
        - baseWithdrawQuantity
        - createdAtDatetime
        - createdAtTimestamp
        - currentValue
        - dislocationEnabled
        - feeTierId
        - impermanentLoss
        - initialBasePrice
        - initialQuotePrice
        - initialValue
        - liquidityId
        - instructionId
        - lowerBound
        - price
        - quoteFee
        - quoteInvestQuantity
        - quotePrice
        - quoteWithdrawQuantity
        - requestId
        - staticSpreadFee
        - status
        - statusReason
        - statusReasonCode
        - symbol
        - updatedAtDatetime
        - updatedAtTimestamp
        - upperBound
        - yieldEarn
      properties:
        liquidityId:
          description: unique AMM instruction ID
          deprecated: true
          allOf:
            - $ref: "#/components/schemas/AMMInstructionID"
        instructionId:
          description: unique AMM instruction ID
          allOf:
            - $ref: "#/components/schemas/AMMInstructionID"
        symbol:
          description: market symbol
          allOf:
            - $ref: "#/components/schemas/MarketSymbol"
        baseFee:
          description: base fee, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        quoteFee:
          description: quote fee, see [asset value](/rest/general/price-quantity-precision) format
          allOf:
            - $ref: "#/components/schemas/AssetValue"
        status:
          description: order status
          allOf:
            - $ref: "#/components/schemas/OrderStatusAsString"
          example: "OPEN"
        statusReason:
          description: status reason, describes why the order is in a specific state
          type: string
          example: "Ok"
        statusReasonCode:
          description: status reason code, see [details](/rest/general/error-rejection-codes)
          type: integer
          example: 1001
        createdAtDatetime:
          description: denotes the time the order was ACK'd by the exchange, ISO 8601 with millisecond as string
          allOf:
            - $ref: "#/components/schemas/DateTime"
        createdAtTimestamp:
          description: denotes the time the order was ACK'd by the exchange
          allOf:
            - $ref: "#/components/schemas/TimeStampAsString"
        24HrApy:
          type: string
          description: APY of the last 24 Hours, only for AMM instructions with `OPEN` status
          example: "2.3319"
        24HrYieldEarn:
          type: string
          description: amount of money earned in USD from the last 24 Hours, only for AMM instructions with `OPEN` status
          example: "0.00"
        apy:
          type: string
          description: yield generated from the time AMM instruction was created, in annualised percentage
          example: "0.0000"
        baseCurrentQuantity:
          type: string
          description: amount of base asset this AMM instruction currently holds, only for AMM instruction with `OPEN` status
          example: "0.00000000"
        baseInvestQuantity:
          type: string
          description: initial base investment
          example: "0.00000008"
        basePrice:
          type: string
          description: current price of base asset
          example: "345.6700"
        baseWithdrawQuantity:
          type: string
          description: amount of base asset returned when AMM instruction is terminated
          example: "0.00000010"
        currentValue:
          type: string
          description: value of assets (base and quote) in USD amount that this AMM instruction currently holds
          example: "0.0000"
        dislocationEnabled:
          description: dislocation enabled/disabled
          type: boolean
          example: false
        feeTierId:
          allOf:
            - $ref: "#/components/schemas/FeeTierId"
        finalValue:
          type: string
          description: value of assets (base and quote) in USD amount when AMM instruction was terminated, only for AMM instruction with `CLOSED` status
          example: "0.0001"
        impermanentLoss:
          type: string
          description: impermanent loss
          example: "0.0000"
        initialBasePrice:
          type: string
          description: price of base asset when AMM instruction was created
          example: "100.0000"
        initialQuotePrice:
          type: string
          description: price of quote asset when AMM instruction was created
          example: "0.0100"
        initialValue:
          type: string
          description: value of assets (base and quote) in USD amount when AMM instruction was created
          example: "0.0000"
        lowerBound:
          type: string
          description: lower bound of price range, in quote currency
          example: "0.0013"
        price:
          type: string
          description: current price of AMM, see [Get Tick By Symbol](/rest/api/get-market-tick)
          example: "456.7800"
        quoteCurrentQuantity:
          type: string
          description: amount of quote asset this AMM instruction currently holds, only for AMM instruction with `OPEN` status
          example: "0.0000"
        quoteInvestQuantity:
          type: string
          description: initial quote investment
          example: "0.0009"
        quotePrice:
          type: string
          description: current price of quote asset
          example: "1.0000"
        quoteWithdrawQuantity:
          type: string
          description: amount of quote asset returned when AMM instruction is terminated
          example: "0.0011"
        lastDistributedPrice:
          type: string
          nullable: true
          description: (Perpetual market only) The price used at the time of settlement for AMM Instructions that can be used to determine mtmPnl and the actual Pnl
          example: null
        requestId:
          description: unique request ID
          allOf:
            - $ref: "#/components/schemas/RequestID"
        staticSpreadFee:
          type: string
          description: static spread fee, see [Get Market By Symbol](/rest/api/get-market-by-symbol)
          example: "0.00200000"
        updatedAtDatetime:
          description: denotes the time the AMM instruction was updated by the exchange, ISO 8601 with millisecond as string
          allOf:
            - $ref: "#/components/schemas/DateTime"
        updatedAtTimestamp:
          description: denotes the time the AMM instruction was updated by the exchange
          allOf:
            - $ref: "#/components/schemas/TimeStampAsString"
        upperBound:
          type: string
          description: upper bound of price range, in quote currency
          example: "14000.0000"
        yieldEarn:
          type: string
          description: amount of money earned in USD
          example: "0.00"
    MarketSymbol:
      type: string
      description: market symbol. E.g. `BTCUSDC` for SPOT and `BTC-USDC-PERP` for PERPETUAL market
      example: "BTCUSDC"
    FeeTierId:
      type: string
      description: unique fee tier ID, see [Get Market By Symbol](/rest/api/get-market-by-symbol)
      example: "1"
    AssetSymbol:
      type: string
      description: asset symbol as denoted in the world
      example: "BTC"
    OrderSide:
      type: string
      example: BUY
      enum:
        - BUY
        - SELL
    OrderStatus:
      type: string
      example: OPEN
      enum:
        - OPEN
        - CLOSED
        - CANCELLED
        - REJECTED
    AMMInstructionStatus:
      type: string
      example: OPEN
      enum:
        - OPEN
        - CLOSED
    DelayBySeconds:
      description: Delay the cancel-all-orders request by (seconds) as a timeout mechanism
      type: string
      enum:
        - "5"
        - "10"
        - "15"
        - "20"
        - "25"
        - "30"
        - "40"
        - "50"
        - "60"
      example: "5"
    CancelId:
      description: Unique id for this cancel request which is an unsigned 64 bit integer expressed as string
      type: string
      example: "123456789"
