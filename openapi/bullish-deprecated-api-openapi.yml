    ```


    ### l2Update response

    | Name                  | Type   | Description                                                                                                                                                |
    |---------------------  |--------|------------------------------------------------------------------------------------------------------------------------------------------------------------|
    | symbol                | String | market symbol                                                                                                                                              |
    | bids                  | Array  | even indices denote price, odd indices denote absolute quantities                                                                                          |
    | asks                  | Array  | even indices denote price, odd indices denote absolute quantities                                                                                          |
    | sequenceNumberRange   | Array  | array of size 2 where first element denotes lower bound, second element denotes upper <br /> bound of sequence numbers represented by the conflated update |
    | datetime              | String | denotes the time the update was created by the engine, ISO 8601 with millisecond as string                                                                 |
    | timestamp             | String | denotes the time the update was created by the engine                                                                                                      |
    | publishedAtTimestamp  | String | denotes the time the update was broadcasted to connected WebSockets                                                                                        |

    ```json
    {
      "type": "update",
      "dataType": "V1TALevel2",
      "data": {
        "symbol": "BTCUSD",
        "bids": [],
        "asks": ["5199.7000", "101.30313224"],
        "sequenceNumberRange": [7, 10],
        "datetime": "2020-06-29T06:28:55.500Z",
        "timestamp": "1593412135500",
        "publishedAtTimestamp": "1593412135600"
      }
    }
    ```

    ### Maintaining Hybrid Order Book
    1. Connect to hybrid order book WebSocket API.
    2. Receive initial snapshot message.
    3. Record sequence number and create order book.
    4. Compare current sequence number with that of new message. If sequence number is out of order, reconnect.
    5. Receive update messages of price levels with new absolute quantity and update order book.
       If quantity is 0, price level is removed.
    6. Receive a subsequent snapshot message and reset existing order book. Create order book with new price levels.

    See connect to hybrid order book WebSocket for a sample Python script.

    ## Market Data WebSocket (authenticated)
    `Deprecated`: *Please use the [unauthenticated multi-order book WebSocket](/websocket/public/market-data/orderbook).*

    Route
    - `/v1/market-data`
    | Topic         |  Description                              | Data Type        | Subscription Type           |
    |:--------------|:------------------------------------------|:-----------------|:----------------------------|
    | l1Orderbook   | Provides updates for Level 1 market data  | `V1TABookLevel1` | By `<TOPIC>` and `<SYMBOL>` |
    ### l1Orderbook response
    - Level 1 market data updates are realtime.
    - If the `sequenceNumber` of an incoming update is smaller than that of a previously received update, then the
    `sequenceNumber` is out of order. Terminate the WebSocket connection and reconnect.
    | Name           | Type   | Description                                                                          |
    |:---------------|:-------|:-----------------------------------------------------------------                    |
    | sequenceNumber | String | incrementing, unique, unsigned integer that identifies a state of the L1 order book   |
    | symbol         | String | market symbol                                                                        |
    | timestamp      | String | denotes the time the update was created                                              |
    | bid            | Array  | nested array containing price and quantity of highest bid                            |
    | ask            | Array  | nested array containing price and quantity of lowest ask                             |
    ```json
    {
      "type": "update",
      "dataType": "V1TABookLevel1",
      "data": {
        "sequenceNumber": "1",
        "symbol": "BTCUSD",
        "timestamp": "1466812800000",
        "bid": [ [ "35.0000", "2.00000000" ] ],
        "ask": [ [ "35.5000", "1.00000000" ] ]
      }
    }
    ```
    See connect to market data WebSocket for a sample Python script.

    ## Spot Account
    `Deprecated`: *Spot Account will be replaced by `Asset Account` which provides a more granular view of the assets in your trading account*

    - REST Endpoints [(Get Spot Accounts)](/rest/deprecated/user-get-spot-accounts)
      - REST - `GET /accounts/spot` replaced by REST - [GET /accounts/asset](/rest/api/get-asset-accounts)
      - REST - `GET /accounts/spot/{symbol}` replaced by REST - [GET `/accounts/asset/{symbol}`](/rest/api/get-asset-account-by-symbol)

    - [Private Data WebSocket (Authenticated)](/websocket/private/private-data)
      - Topic: `spotAccounts` replaced by `assetAccounts`
      - Response: `V1TASpotAccount` replaced by `V1TAAssetAccount`
    ### spotAccounts response

    The *Formula* colummn below shows how the fields in `V1TASpotAccount` are calculated.

    | Name                 | Type   | Description                                                                                                                                                                         |  Formula <br /> (expressed in `assetAccounts` response fields)      |
    |:---------------------|:-------|:------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|:--------------------------------------------------------------------|
    | accountId            | String | unique spot account ID                                                                                                                                                              |                                                                     |
    | symbol               | String | asset symbol                                                                                                                                                                        |                                                                     |
    | type                 | String | type of account                                                                                                                                                                     |                                                                     |
    | total                | String | total is `free` + `used` assets within the account, see [asset value](/rest/general/price-quantity-precision) format                                             |   =max(0, availableQuantity - borrowedQuantity) + lockedQuantity    |
    | free                 | String | refers to the assets that are available to use on the account excluding borrowed assets, see [asset value](/rest/general/price-quantity-precision) format.       |   =max(0, availableQuantity - borrowedQuantity)                     |
    | used                 | String | refers to the assets that are locked in orders, see [asset value](/rest/general/price-quantity-precision) format                                                 |   =lockedQuantity                                                   |
    | updatedAtDatetime    | String | denotes the time the spot account was updated by the exchange, ISO 8601 with millisecond as string                                                                                  |                                                                     |
    | updatedAtTimestamp   | String | denotes the time the spot account was updated by the exchange                                                                                                                       |                                                                     |
    | publishedAtTimestamp | String | denotes the time the update was broadcasted to connected WebSockets                                                                                                                 |                                                                     |


    ```json
    {
      "tradingAccountId": "1111",
      "type": "snapshot",
      "dataType": "V1TASpotAccount",
      "data": [
        {
          "accountId": "1",
          "type": "spot",
          "symbol": "BTC",
          "total": "4.00000000",
          "free": "4.00000000",
          "used": "0.00000000",
          "updatedAtDatetime": "2021-12-30T07:36:35.918Z",
          "updatedAtTimestamp": "1640849795918",
          "publishedAtTimestamp": "1640849795920"
        }
      ]
    }
    ```

    ## Anonymous Trades WebSocket (unauthenticated)
    **Route**
    - `/v1/market-data/trades/{symbol}`

    **Note**: This endpoint does not require subscriptions.

    On connection, the client receives a snapshot of the latest 100 trades, in descending order. Subsequently,
    the client receives real-time updates of trades that have been executed. If the `tradeId` of an incoming update is 
    smaller than that of a previously received update, then the `tradeId` is out of order. Terminate the
    WebSocket connection and reconnect.

    ### Trades response

    | Name                 | Type      | Description                                                                               |
    |:---------------------|:----------|:------------------------------------------------------------------------------------------|
    | tradeId              | String    | unique trade ID                                                                           |
    | symbol               | String    | market symbol                                                                             |
    | price                | String    | price, see [asset value](/rest/general/price-quantity-precision) format                  |
    | quantity             | String    | quantity, see [asset value](/rest/general/price-quantity-precision) format               |
    | side                 | String    | order side                                                                                |
    | isTaker              | Boolean   | denotes whether this is a taker's trade                                                   |
    | createdAtTimestamp   | String    | denotes the time the order was ACK'd by the exchange                                      |
    | createdAtDatetime    | String    | denotes the time the order was ACK'd by the exchange, ISO 8601 with millisecond as string |
    | publishedAtTimestamp | String    | denotes the time the update was broadcasted to connected WebSockets                       |

    ```json
    {
      "type": "update",
      "dataType": "V1TAAnonymousTrade",
      "data": {
        "tradeId": "100000000000001050",
        "symbol": "BTCUSD",
        "price": "11528.2203",
        "quantity": "1.00000000",
        "side": "BUY",
        "isTaker": true,
        "createdAtTimestamp": "1662453438774",
        "createdAtDatetime": "2022-09-06T08:37:18.774Z",
        "publishedAtTimestamp": "1662453438780"
      }
    }
    ```

    See [connect to trades WebSocket](https://github.com/bullish-exchange/api-examples/blob/master/websocket/trades_web_socket.py) for a sample Python script.

    ## Decommissioned Features
    List of Features that have been decommissioned and no longer usable.

    ## Changelog
    ### 2025 Changes
      - May
        - Deprecated Features:
          - Anonymous Trades WebSocket (unauthenticated)
    ### 2024 Changes
      - April
        - Deprecated Features:
          - Bullish API Key
          - Signing Format (Old)
          - Hybrid OrderBook WebSocket (unauthenticated)
          - Market Data WebSocket (authenticated)
          - Spot Account
        - Deprecated APIs for end of Q3 2024:
          - REST - `GET | POST | DELETE /trading-api/v1/orders`
          - REST - `GET /v1/orders/{orderId}`
          - REST - `POST /v1/command?commandType=V1CancelAllOrders`
          - REST - `POST /v1/command?commandType=V1CancelAllOrdersByMarket`
          - REST - `POST /v1/command?commandType=V1DelayedCancelAllOrders`
          - REST - `POST /v1/command?commandType=V1UnsetDelayedCancelAllOrders`
          - REST - `GET | POST | DELETE /v1/amm-instructions`
          - REST - `GET /v1/amm-instructions/{liquidityId}`
        - Deprecated APIs:
          - REST `GET /accounts/spot`
          - REST `GET /accounts/spot/asset`

