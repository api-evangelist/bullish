  transport: http
  url: null
  auth: 'Would require the Bullish JWT bearer flow — an ECDSA R1 or HMAC signed login exchanged for a
    24-hour token. This is the reason a first-party server matters here: the signing step is exactly the
    part an agent cannot improvise.'
design_notes:
  read_write_split: A responsible Bullish MCP server should ship the public read surface unguarded and
    gate every write behind explicit human confirmation. Order creation, amendment, cancellation, AMM
    instructions, OTC booking and custody withdrawal all move real money on a regulated venue, and there
    is NO idempotency key — a retried tool call is a second order, not a deduplicated one.
  highest_consequence_tools:
  - create_order
