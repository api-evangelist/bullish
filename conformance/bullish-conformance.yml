    evidence: 'six AsyncAPI 3.0.0 documents published at docs.exchange.bullish.com/api-specifications'
  - id: fix-protocol
    conforms: true
    evidence: >-
      Documented FIX order-entry, drop-copy, reference-data and trading-status
      surfaces with component definitions and session management; rejections use
