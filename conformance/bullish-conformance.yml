notes: >-
  Standards conformance derived from the published specs plus the compliance
  posture on the Trust and Transparency page. Bullish is unusual among exchanges
  in shipping BOTH a real OpenAPI 3.0.3 and six real AsyncAPI 3.0.0 documents, and
  in supporting FIX alongside REST and WebSocket. It is equally notable for what it
  does NOT do: no OAuth, no RFC 9457 problem details, no RFC 8594 Sunset headers,
  and no /.well-known/ surface at all.
