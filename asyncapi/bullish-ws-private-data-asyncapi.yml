      subscribe-nack:
        title: Rejection
        summary: Explain why the topic could not be subscribed
        payload:
          $ref: "#/components/schemas/PrivateDataRejectionPayload"
      keepalive-ping:
        title: Keepalive Ping
        payload:
          type: object
          required:
            - id
            - method
            - params
          properties:
            method:
              type: string
              description: '"keepalivePing"'
              example: keepalivePing
            params:
              type: object
            id:
              $ref: "#/components/schemas/PrivateDataJsonRpcRequestId"
            jsonrpc:
              $ref: "#/components/schemas/PrivateDataJsonRpcVersion"
            type:
              $ref: "#/components/schemas/PrivateDataJsonRpcCommandType"
      keepalive-pong:
        title: Keepalive Pong
        payload:
          type: object
          properties:
            id:
              $ref: "#/components/schemas/PrivateDataJsonRpcRequestId"
            jsonrpc:
              $ref: "#/components/schemas/PrivateDataJsonRpcVersion"
            result:
              type: object
              properties:
                responseCodeName:
                  type: string
                  description: '"OK"'
                  example: OK
                responseCode:
                  type: integer
                  description: "200"
                  example: 200
                message:
                  type: string
                  description: '"Keep alive pong"'
                  example: Keep alive pong
      unsubscribe:
        title: Unsubscription
        summary: Let you unsubscribe from an opened subscription
        payload:
          type: object
          required:
            - id
            - method
            - params
          properties:
            method:
              type: string
              description: '"unsubscribe"'
              example: unsubscribe
            id:
              $ref: "#/components/schemas/PrivateDataJsonRpcRequestId"
            jsonrpc:
              $ref: "#/components/schemas/PrivateDataJsonRpcVersion"
            type:
              $ref: "#/components/schemas/PrivateDataJsonRpcCommandType"
            params:
              type: object
              required:
                - subscriptionId
              properties:
                subscriptionId:
                  type: string
                  description: ID returned by the server when the subscription was opened
                  example: "1611082473000"
      unsubscribe-ack:
        title: Acknowledgment
        summary: Confirm the subscription was closed
        payload:
          type: object
          properties:
            id:
              $ref: "#/components/schemas/PrivateDataJsonRpcRequestId"
            jsonrpc:
              $ref: "#/components/schemas/PrivateDataJsonRpcVersion"
            result:
              type: object
              properties:
                responseCodeName:
                  type: string
                  description: '"OK"'
                  example: OK
                responseCode:
                  type: string
                  description: "200"
                  example: "200"
                message:
                  type: string
                  description: Confirmation that the subscription was closed
                  example: Successfully unsubscribed
      unsubscribe-nack:
        title: Rejection
        summary: Explain why the topic could not be unsubscribed
        payload:
          $ref: "#/components/schemas/PrivateDataRejectionPayload"
operations:
  subscribe:
    action: send
    channel:
      $ref: "#/channels/data"
    description: |
      ## Subscribe
      Multiple subscriptions could be opened within the same websocket.

      The topics & accounts to be subscribed are controlled by the parameters in
      the subscription message listed below.

      After subscribing, the server sends :
      - an acknowledgement
      - then an initial snapshot
      - followed by incremental updates.
    messages:
      - $ref: "#/channels/data/messages/subscribe"
  subscribe-nack:
    action: receive
    channel:
      $ref: "#/channels/data"
    description: |
      In case of *invalid* subscription message, an error rejection would be sent.

      This also includes trading account [access rejections](/websocket/protocol/authentication#websocket-subscription)
    messages:
      - $ref: "#/channels/data/messages/subscribe-nack"
  receive-orders:
    action: receive
    channel:
      $ref: "#/channels/data"
    description: |
      ## Receive Orders
    messages:
      - $ref: "#/channels/data/messages/subscribe-ack"
      - $ref: "#/channels/data/messages/subscribe-msg-0-orders"
      - $ref: "#/channels/data/messages/subscribe-msg-1-orders"
  receive-trades:
    action: receive
    channel:
      $ref: "#/channels/data"
    description: |
      ## Receive Trades
    messages:
      - $ref: "#/channels/data/messages/subscribe-ack"
      - $ref: "#/channels/data/messages/subscribe-msg-0-trades"
      - $ref: "#/channels/data/messages/subscribe-msg-1-trades"
  receive-spotAccounts:
    action: receive
    channel:
      $ref: "#/channels/data"
    description: |
      ## Receive Spot Accounts
    messages:
      - $ref: "#/channels/data/messages/subscribe-ack"
      - $ref: "#/channels/data/messages/subscribe-msg-0-spotAccounts"
      - $ref: "#/channels/data/messages/subscribe-msg-1-spotAccounts"
    x-deprecated: true
  receive-assetAccounts:
    action: receive
    channel:
      $ref: "#/channels/data"
    description: |
      ## Receive Asset Accounts
      **V1TAAssetAccount** provides a more granular view of the assets in your trading account compared to **V1TASpotAccount**.
    messages:
      - $ref: "#/channels/data/messages/subscribe-ack"
      - $ref: "#/channels/data/messages/subscribe-msg-0-assetAccounts"
      - $ref: "#/channels/data/messages/subscribe-msg-1-assetAccounts"
  receive-tradingAccounts:
    action: receive
    channel:
      $ref: "#/channels/data"
    description: |
      ## Receive Trading Accounts
      - Provides a summary of the total borrowed and total collateral values on the specific trading account id.
      **totalBorrowedQuantity** and **totalCollateralQuantity** do not represent the absolute quantity of the borrowed assets
      and are notional values represented in the reference asset.
      - **Snapshot** contains a list with a single entry corresponding to the trading account id specified in
      the **tradingAccountId** query parameter when opening the WebSocket connection.
    messages:
      - $ref: "#/channels/data/messages/subscribe-ack"
      - $ref: "#/channels/data/messages/subscribe-msg-0-tradingAccounts"
      - $ref: "#/channels/data/messages/subscribe-msg-1-tradingAccounts"
  receive-derivativesPositions:
    action: receive
    channel:
      $ref: "#/channels/data"
    description: |
      ## Receive Derivatives Positions
      *Topic **derivativesPosition** is being replaced by **derivativesPositionV2**.*

      - Provide a detail view of the derivative position of each market.
    messages:
      - $ref: "#/channels/data/messages/subscribe-ack"
      - $ref: "#/channels/data/messages/subscribe-msg-0-derivativesPositions"
      - $ref: "#/channels/data/messages/subscribe-msg-1-derivativesPositions"
    x-deprecated: true
  receive-derivativesPositionsV2:
    action: receive
    channel:
      $ref: "#/channels/data"
    description: |
      ## Receive Derivatives Positions (V2)
      Provide a detail view of the derivative position of each market.
    messages:
      - $ref: "#/channels/data/messages/subscribe-ack"
      - $ref: "#/channels/data/messages/subscribe-msg-0-derivativesPositionsV2"
      - $ref: "#/channels/data/messages/subscribe-msg-1-derivativesPositionsV2"
  receive-ammInstructions:
    action: receive
    channel:
      $ref: "#/channels/data"
    description: |
      ## Receive AMM Instructions
      - Provides updates of the active AMM instructions on the specific trading account id.
      - This topic *does not* provide snapshot
    messages:
      - $ref: "#/channels/data/messages/subscribe-ack"
      - $ref: "#/channels/data/messages/subscribe-msg-1-ammInstructions"
  receive-mmpTrigger:
    action: receive
    channel:
      $ref: "#/channels/data"
    description: |
      ## Receive MMP Triggers
    messages:
      - $ref: "#/channels/data/messages/subscribe-ack"
      - $ref: "#/channels/data/messages/subscribe-msg-0-mmpTrigger"
      - $ref: "#/channels/data/messages/subscribe-msg-1-mmpTrigger"
  receive-mmpRequest:
    action: receive
    channel:
      $ref: "#/channels/data"
    description: |
      ## Receive MMP Requests
    messages:
      - $ref: "#/channels/data/messages/subscribe-ack"
      - $ref: "#/channels/data/messages/subscribe-msg-0-mmpRequest"
      - $ref: "#/channels/data/messages/subscribe-msg-1-mmpRequest"
  keepalive-ping:
    action: send
    channel:
      $ref: "#/channels/data"
    description: |
      ## Keepalive
      In case nothing is subscribed to, keep the websocket connection alive.
    messages:
      - $ref: "#/channels/data/messages/keepalive-ping"
  keepalive-pong:
    action: receive
    channel:
      $ref: "#/channels/data"
    description: |
      Acknowledgement returned by the server in response to a keepalive-ping.
    messages:
      - $ref: "#/channels/data/messages/keepalive-pong"
  unsubscribe:
    action: send
    channel:
      $ref: "#/channels/data"
    description: |
      ## Unsubscribe
      Let you unsubscribe a specific topic while keeping your websocket opened.
    messages:
      - $ref: "#/channels/data/messages/unsubscribe"
  unsubscribe-ack:
    action: receive
    channel:
      $ref: "#/channels/data"
    description: After unsubscribing, the server sends an acknowledgement.
    messages:
      - $ref: "#/channels/data/messages/unsubscribe-ack"
  unsubscribe-nack:
    action: receive
    channel:
      $ref: "#/channels/data"
    description: In case of *invalid* unsubscription message, an error rejection would be sent.
    messages:
      - $ref: "#/channels/data/messages/unsubscribe-nack"
components:
  schemas:
    PrivateDataJsonRpcRequestId:
      type: string
      description: ID returned by server in the acknowledgement
      example: "1611082473000"
    PrivateDataJsonRpcVersion:
      description: Version of the Json RPC protocol
      example: "2.0"
    PrivateDataJsonRpcCommandType:
      description: '"command"'
      example: command
    PrivateDataRejectionPayload:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/PrivateDataJsonRpcRequestId"
        jsonrpc:
          $ref: "#/components/schemas/PrivateDataJsonRpcVersion"
        error:
          type: object
          properties:
            code:
              type: string
              description: a high-level code for the error
              example: "-32602"
            errorCode:
              type: string
              description: a precise typed error code
              example: "29013"
            errorCodeName:
              type: string
              description: An explanation of which value was invalid
              example: "'abcde' is not a valid topic"
