        payload:
          type: object
          properties:
            type:
              type: string
              description: '"update"'
              example: update
            dataType:
              type: string
              description: '"V1TAMMPConfigRequest"'
              example: V1TAMMPConfigRequest
            data:
              description: An order
              type: object
              properties:
                tradingAccountId:
                  type: string
                  description: id of the trading account
                requestId:
                  type: string
                  description: id of the request
                assetSymbol:
                  type: string
                  description: underlying asset symbol
                windowTimeInSecond:
                  type: string
                  description: time window during which the MMP checks are conducted
                frozenTimeInSecond:
                  type: string
                  description: duration for which a market maker's trading activity is temporarily halted after a protective measure is triggered
                quantityLimit:
                  type: string
                  description: cap on the total number of contracts that a market maker can trade within windowTimeInSeconds
                deltaLimit:
                  type: string
                  description: net delta exposure that a market maker can accumulate within windowTimeInSeconds
                status:
                  type: string
                  description: status of the request
                statusReason:
                  type: string
                  description: status reason, describes why the request is in a specific state
                isReset:
                  type: string
                  description: boolean value that indicates if it was a set or reset MMP configuration request
                createdAt:
                  type: string
                  description: denotes the time the request was ACK'd by the exchange
              example:
                requestId: "1"
                tradingAccountId: "111000000000000"
                assetSymbol: BTC
                windowTimeInSecond: "10"
                frozenTimeInSecond: "10"
                quantityLimit: "1000"
                deltaLimit: "500"
                status: CLOSED
                statusReason: Ok
