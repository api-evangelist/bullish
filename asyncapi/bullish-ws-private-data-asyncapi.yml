      subscribe-msg-0-mmpTrigger:
        title: Snapshot
        summary: Initial full state of the subscribed MMP trigger data
        payload:
          type: object
          properties:
            type:
              type: string
              description: '"snapshot"'
              example: snapshot
            dataType:
              type: string
              description: '"V1TAMMPTrigger"'
              example: V1TAMMPTrigger
            data:
              type: array
              description: List of MMP triggers
              items:
                type: object
                properties:
                  tradingAccountId:
                    type: string
                    description: id of the trading account
                  mmpTriggerId:
                    type: string
                    description: unique MMP trigger id
                  underlyingAssetSymbol:
                    type: string
                    description: underlying asset symbol
                  triggeredBy:
                    type: string
                    description: trigger reason
                  frozenTimeInSecond:
                    type: string
                    description: duration for which a market maker's trading activity is temporarily halted after a protective measure is triggered
                  frozenStartTime:
                    type: string
                    description: start time of the MMP trigger in epoch milliseconds
                  frozenUntil:
                    type: string
                    description: end time of the MMP trigger in epoch milliseconds
              example:
                - mmpTriggerId: "100000000000000"
                  tradingAccountId: "111000000000000"
                  underlyingAssetSymbol: BTC
                  triggeredBy: Delta Limit
                  frozenTimeInSecond: "10"
                  frozenStartTime: "1611082473000"
                  frozenUntil: "1611082483000"
      subscribe-msg-1-mmpTrigger:
        title: Update
        summary: Incremental update to the subscribed MMP trigger data
        payload:
          type: object
          properties:
            type:
              type: string
              description: '"update"'
              example: update
            dataType:
              type: string
              description: '"V1TAMMPTrigger"'
              example: V1TAMMPTrigger
            data:
              description: A MMP trigger
              type: object
              properties:
                tradingAccountId:
                  type: string
                  description: id of the trading account
                mmpTriggerId:
                  type: string
                  description: unique MMP trigger id
                underlyingAssetSymbol:
                  type: string
                  description: underlying asset symbol
                triggeredBy:
                  type: string
                  description: trigger reason
                frozenTimeInSecond:
                  type: string
                  description: duration for which a market maker's trading activity is temporarily halted after a protective measure is triggered
                frozenStartTime:
                  type: string
                  description: start time of the MMP trigger in epoch milliseconds
                frozenUntil:
                  type: string
                  description: end time of the MMP trigger in epoch milliseconds
              example:
                mmpTriggerId: "100000000000000"
                tradingAccountId: "111000000000000"
                underlyingAssetSymbol: BTC
                triggeredBy: Delta Limit
                frozenTimeInSecond: "10"
                frozenStartTime: "1611082473000"
                frozenUntil: "1611082483000"
      subscribe-msg-0-mmpRequest:
        title: Snapshot
        summary: Initial full state of the subscribed trade data
        payload:
          type: object
          properties:
            type:
              type: string
              description: '"snapshot"'
              example: snapshot
            dataType:
              type: string
              description: '"V1TAMMPConfigRequest"'
              example: V1TAMMPConfigRequest
            data:
              type: array
              description: List of orders
              items:
                type: object
                properties:
                  tradingAccountId:
                    type: string
                    description: id of the trading account
                  requestId:
                    type: string
                    description: id of the request
                  assetSymbol:
                    type: string
                    description: underlying asset symbol
                  windowTimeInSecond:
                    type: string
                    description: time window during which the MMP checks are conducted
                  frozenTimeInSecond:
                    type: string
                    description: duration for which a market maker's trading activity is temporarily halted after a protective measure is triggered
                  quantityLimit:
                    type: string
                    description: cap on the total number of contracts that a market maker can trade within windowTimeInSeconds
                  deltaLimit:
                    type: string
                    description: net delta exposure that a market maker can accumulate within windowTimeInSeconds
                  status:
                    type: string
                    description: status of the request
                  statusReason:
                    type: string
                    description: status reason, describes why the request is in a specific state
                  isReset:
                    type: string
                    description: boolean value that indicates if it was a set or reset MMP configuration request
                  createdAt:
                    type: string
                    description: denotes the time the request was ACK'd by the exchange
              example:
                - requestId: "1"
                  tradingAccountId: "111000000000000"
                  assetSymbol: BTC
                  windowTimeInSecond: "10"
                  frozenTimeInSecond: "10"
                  quantityLimit: "1000"
                  deltaLimit: "500"
                  status: CLOSED
                  statusReason: Ok
                  isReset: "false"
                  createdAt: "1611082473000"
