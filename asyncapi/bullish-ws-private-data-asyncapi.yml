                currentValue: "0.0000"
                feeTierId: "1"
                finalValue: "0.0001"
                impermanentLoss: "0.0000"
                liquidity: "0.0001"
                lowerBound: "0.0013"
                price: "456.7800"
                quoteCurrentQuantity: "0.0000"
                quoteInvestQuantity: "0.0009"
                quotePrice: "1.0000"
                quoteWithdrawQuantity: "0.0011"
                lastDistributedPrice: null
