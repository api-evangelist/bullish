                  warningMarginUSD:
                    type: string
                    description: The minimum margin when the customer will receive warning via email/notifications over UI
                  liquidationMarginUSD:
                    type: string
                    description: The minimum value of margin one must maintain in order to avoid liquidation
                  fullLiquidationMarginUSD:
                    type: string
                    description: The value of margin when full liquidation occurs
                  endCustomerId:
                    type: string
                    description: The end customer id used for self trade prevention (default is institution id, max 32 characters)
                  defaultedMarginUSD:
                    type: string
                    description: The value of margin when this trading account will be moved into a Defaulted state
                  riskLimitUSD:
                    type: string
                    description: The maximum allowed borrowing for this trading account displayed in USD
                  totalLiabilitiesUSD:
                    type: string
                    description: The total liabilities for this trading account displayed in USD
                  maxInitialLeverage:
                    type: string
                    description: The maximum initial leverage
                  isPrimaryAccount:
                    type: string
                    description: Whether this trading account is the primary account
                  isBorrowing:
                    type: string
                    description: Whether this trading account is borrowing any asset
                  isLending:
                    type: string
