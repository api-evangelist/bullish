summary: Bullish publishes a complete numeric reason-code registry covering order processing, custody,
  OTC and market-maker protection, shared across the REST and FIX surfaces. On REST the code and text
  arrive as statusReasonCode and statusReason; on FIX as OrdRejReason (tag 103) and Text (tag 58). Note
  that the 6xxx block is a lifecycle-state registry as much as an error registry — 6001 Open / 6014 Order
  accepted / 6015 Filled are successful terminal states carried on the same field.
envelope:
  rest:
    code_field: statusReasonCode
    text_field: statusReason
    media_type: application/json
  fix:
    code_field: OrdRejReason (103)
    text_field: Text (58)
